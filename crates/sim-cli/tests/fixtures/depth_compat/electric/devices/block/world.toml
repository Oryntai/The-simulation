# Гравитация: стандартное g₀ (CGPM, 1901). Зерно фиксирует опыт, частота — нижняя сетка сходимости.
format = 3
name = "Лёгкая рама, три опоры и мишень"
seed = 1
physics_hz = 2000
gravity_m_s2 = [0.0, 0.0, -9.80665]
[environment]
density_kg_m3 = 0.0
viscosity_pa_s = 0.0
wind_m_s = [0.0, 0.0, 0.0]

# Красная мишень радиусом 0,12 м на расстоянии около 1,6 м даёт >100 px площади
# при f=90 px из каталога reference-rgb. Разметка — данные сцены.
[[environment.visual]]
shape = { kind = "sphere", radius_m = 0.12 }
pose = { position_m = [1.65, 0.03, 1.69] }
rgba = [1.0, 0.0, 0.0, 1.0]

[[devices]]
name = "устройство"
file = "device.toml"
pose = { position_m = [-0.05168125843850681, 0.0, 1.643406482372448] }
