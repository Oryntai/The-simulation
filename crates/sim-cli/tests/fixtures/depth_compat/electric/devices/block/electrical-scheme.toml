[rails.vdd]
ends = ["imu/vdd", "imu/g"]
reverse_limit_v = { measurement = "Подтвердить обратное напряжение и предел защиты экземпляра." }

[rails.vddio]
ends = ["imu/vddio", "imu/gndio"]
reverse_limit_v = { measurement = "Подтвердить обратное напряжение и предел защиты экземпляра." }

[rails."питание камеры"]
ends = ["camera/p", "camera/g"]
reverse_limit_v = { measurement = "Подтвердить обратное напряжение и предел защиты экземпляра." }

[[bindings]]
ends = ["imu/vdd", "imu/g"]
target = { kind = "sensor_power", sensor = "импульсы" }
