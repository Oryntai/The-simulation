format = 1
scope = "assembly"
name = "Монтажная схема датчиков, раздельные выводы VDD и VDDIO"
nets = ["g", "protected", "raw", "scl", "sda", "vdd", "video"]

[components.pack]
part = "cell_pack_unspecified"
nets = { p = "raw", g = "g" }

[components.fuse]
part = "fuse_series"
nets = { input = "raw", output = "protected" }

[components.ldo]
part = "wearable_ldo_33"
nets = { input = "protected", output = "vdd", g = "g" }

[components.cap]
part = "imu_decoupling"
nets = { plus = "vdd", minus = "g" }

[components.imu]
part = "bmi270_i2c"
nets = { vdd = "vdd", vddio = "vdd", g = "g", gndio = "g", sda = "sda", scl = "scl", csb = "vdd", sdo = "g" }

[components.host]
part = "ble_host_unspecified"
nets = { p = "vdd", g = "g", sda = "sda", scl = "scl", camera_bus = "video" }

[components.camera]
part = "rgb_module_unspecified"
nets = { p = "vdd", g = "g", bus = "video" }

[components.pull_sda]
part = "i2c_pullup"
nets = { a = "vdd", b = "sda" }

[components.pull_scl]
part = "i2c_pullup"
nets = { a = "vdd", b = "scl" }

[components.ground]
part = "harness_copper"
nets = { a = "g", b = "g" }

[components.feed_raw]
part = "harness_copper"
nets = { a = "raw", b = "raw" }

[components.feed_protected]
part = "harness_copper"
nets = { a = "protected", b = "protected" }

[components.host_ground]
part = "harness_copper"
nets = { a = "g", b = "g" }

[components.host_power]
part = "harness_copper"
nets = { a = "vdd", b = "vdd" }

[components.camera_ground]
part = "harness_copper"
nets = { a = "g", b = "g" }

[components.camera_power]
part = "harness_copper"
nets = { a = "vdd", b = "vdd" }

[components.camera_link]
part = "harness_copper"
nets = { a = "video", b = "video" }

[components.sda]
part = "harness_copper"
nets = { a = "sda", b = "sda" }

[components.scl]
part = "harness_copper"
nets = { a = "scl", b = "scl" }

[components.bypass_vdd]
part = "bmi270_bypass"
nets = { a = "vdd", b = "g" }

[components.bypass_vddio]
part = "bmi270_bypass"
nets = { a = "vdd", b = "g" }

[connections.ground_start]
kind = "splice"
ends = ["pack/g", "ground/a"]
resistance_ohm = { measurement = "Четырёхпроводно измерить сопротивление участка и стыка без питания." }
current_limit_a = { measurement = "Подтвердить ток по проводу, контакту и длительности с контролем нагрева." }
after = []

[connections.ground_finish]
kind = "splice"
ends = ["ground/b", "ldo/g"]
resistance_ohm = { measurement = "Четырёхпроводно измерить сопротивление участка и стыка без питания." }
current_limit_a = { measurement = "Подтвердить ток по проводу, контакту и длительности с контролем нагрева." }
after = ["ground_start"]

[connections.feed_raw_start]
kind = "splice"
crimp = true
ends = ["pack/p", "feed_raw/a"]
resistance_ohm = { measurement = "Четырёхпроводно измерить сопротивление участка и стыка без питания." }
current_limit_a = { measurement = "Подтвердить ток по проводу, контакту и длительности с контролем нагрева." }
after = ["ground_finish"]

[connections.feed_raw_finish]
kind = "solder"
ends = ["feed_raw/b", "fuse/input"]
resistance_ohm = { measurement = "Четырёхпроводно измерить сопротивление участка и стыка без питания." }
current_limit_a = { measurement = "Подтвердить ток по проводу, контакту и длительности с контролем нагрева." }
after = ["feed_raw_start"]

[connections.feed_protected_start]
kind = "solder"
ends = ["fuse/output", "feed_protected/a"]
resistance_ohm = { measurement = "Четырёхпроводно измерить сопротивление участка и стыка без питания." }
current_limit_a = { measurement = "Подтвердить ток по проводу, контакту и длительности с контролем нагрева." }
