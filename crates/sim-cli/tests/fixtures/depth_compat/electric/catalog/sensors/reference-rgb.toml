bias = { value = 0.0, provenance = "estimate", source = "Сверка проекции без ошибок цвета" }
noise_std = { value = 0.0, provenance = "estimate", source = "Сверка проекции без шума" }
drift_per_s = { value = 0.0, provenance = "estimate", source = "Сверка проекции без дрейфа" }
