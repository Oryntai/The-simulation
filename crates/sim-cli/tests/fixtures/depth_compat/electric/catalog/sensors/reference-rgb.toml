id = "reference-rgb"
kind = "color_camera"
name = "Синтетическая RGB-камера для сверки проекции"

[model]
# Параметры стенда, не паспорт конкретного изделия. Эффекты отключаются явно.
rate_hz = { value = 25.0, provenance = "estimate", source = "Период 40 мс оставляет паузу после сбора и доставки кадра" }
latency_s = { value = 0.008, provenance = "estimate", source = "Задержка стенда 8 мс после экспозиции" }
width = { value = 96.0, provenance = "estimate", source = "Сетка стенда 96×72, достаточно для субпиксельной сверки центра карточки" }
height = { value = 72.0, provenance = "estimate", source = "Сетка стенда 96×72" }
fx = { value = 90.0, provenance = "estimate", source = "Выбранный фокус 90 px, горизонтальный обзор 2 arctan(48/90)" }
fy = { value = 90.0, provenance = "derived", source = "Квадратный пиксель, fy = fx" }
cx = { value = 48.0, provenance = "derived", source = "Главная точка в центре ширины 96 px" }
cy = { value = 36.0, provenance = "derived", source = "Главная точка в центре высоты 72 px" }
k1 = { value = 0.0, provenance = "estimate", source = "Идеальная оптика стенда без дисторсии" }
k2 = { value = 0.0, provenance = "estimate", source = "Идеальная оптика стенда без дисторсии" }
k3 = { value = 0.0, provenance = "estimate", source = "Идеальная оптика стенда без дисторсии" }
p1 = { value = 0.0, provenance = "estimate", source = "Идеальная оптика стенда без дисторсии" }
p2 = { value = 0.0, provenance = "estimate", source = "Идеальная оптика стенда без дисторсии" }
near_m = { value = 0.03, provenance = "estimate", source = "Ближняя граница стенда, мишень на дистанции порядка метра" }
far_m = { value = 4.0, provenance = "estimate", source = "Дальняя граница стенда за мишенью" }
exposure_s = { value = 0.016, provenance = "estimate", source = "Экспозиция стенда 16 мс для наблюдаемого смаза" }
readout_s = { value = 0.0, provenance = "estimate", source = "Общий затвор для сверки всех строк в одни и те же моменты" }
