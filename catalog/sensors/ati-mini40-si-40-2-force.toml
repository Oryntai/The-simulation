# Шестиосевой датчик ATI Mini40 с калибровкой SI-40-2: силовая половина.
# Вторая половина — ati-mini40-si-40-2-torque.toml. Источники: ATI Mini40, калибровка SI-40-2: https://www.ati-ia.com/products/ft/ft_models.aspx?id=Mini40; ATI/Novanta Mini40: https://ati.novanta.com/product/mini40-force-torque-sensor/.
id = "ati-mini40-si-40-2-force"
kind = "force"
name = "ATI Mini40 SI-40-2, силы"

[model]
