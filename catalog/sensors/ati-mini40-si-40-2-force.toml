min = { value = -40.0, provenance = "datasheet", source = "Диапазон Fx, Fy ±40 Н (Fz ±120 Н, взята меньшая граница для всех осей): ATI Mini40, калибровка SI-40-2: https://www.ati-ia.com/products/ft/ft_models.aspx?id=Mini40" }
