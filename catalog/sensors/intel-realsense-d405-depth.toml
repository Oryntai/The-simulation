id = "intel-realsense-d405-depth"
kind = "depth_camera"
name = "Intel RealSense D405, поток глубины"

# Близкая стереокамера глубины: 42 × 42 × 23 мм, 60 г, глобальный затвор, обзор глубины 87° × 58°,
# идеальная дальность 7–50 см, точность ±2 % на 50 см, глубина до 1280 × 720 и до 90 кадров/с.
# Источник паспортных чисел — страница изделия: https://www.realsenseai.com/products/stereo-depth-camera-d405/
# Режим 424 × 240 и все шумы ниже — оценки до замера экземпляра.

[model]
rate_hz = { value = 30.0, provenance = "estimate", source = "Выбран режим 30 кадров/с из паспортного «до 90»." }
latency_s = { value = 0.03, provenance = "estimate", source = "Сборка стереопары и доставка по USB около 30 мс; не замерено." }
width = { value = 424.0, provenance = "estimate", source = "Прореженный режим 424 × 240: в паспорте не найден, проверить на изделии." }
height = { value = 240.0, provenance = "estimate", source = "Прореженный режим 424 × 240: в паспорте не найден, проверить на изделии." }
fx = { value = 223.4, provenance = "derived", source = "212 / tan(87°/2): паспортный горизонтальный обзор глубины 87° на ширине 424." }
fy = { value = 223.4, provenance = "derived", source = "Квадратный пиксель, fy = fx; вертикальный обзор 2·atan(120/223.4) = 56.5° при паспортных 58°." }
cx = { value = 212.0, provenance = "derived", source = "Главная точка в центре ширины 424; на изделии — из калибровки." }
cy = { value = 120.0, provenance = "derived", source = "Главная точка в центре высоты 240; на изделии — из калибровки." }
