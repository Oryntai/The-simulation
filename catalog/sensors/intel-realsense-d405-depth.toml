p2 = { value = 0.0, provenance = "estimate", source = "Поток глубины выпрямлен на камере; остаточная дисторсия не замерена." }
near_m = { value = 0.01, provenance = "estimate", source = "Ближе паспортных 7 см камера не даёт глубины, но предмет там всё равно загораживает обзор: граница 1 см оставляет загораживание, а отсчёты ближе 7 см отбрасывает контроллер." }
far_m = { value = 0.8, provenance = "estimate", source = "Дальше идеальных 50 см ошибка растёт квадратично; дальше 0.8 м стол не рассматривается." }
