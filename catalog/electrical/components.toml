d = { contact = "bare", role = "passive" }
g = { contact = "bare", role = "control" }
s = { contact = "bare", role = "return" }

[parts.pmos.elements]
m = { kind = "pmos", nodes = ["d", "g", "s", "s"], parameters = { threshold_v = { measurement = "Аппроксимировать по семейству ВАХ с учётом температур и погрешности" }, kp_a_per_v2 = { measurement = "Аппроксимировать по семейству ВАХ с учётом температур и погрешности" }, lambda_per_v = { measurement = "Аппроксимировать по семейству ВАХ с учётом температур и погрешности" }, is_a = { measurement = "Аппроксимировать по семейству ВАХ с учётом температур и погрешности" }, width_m = { measurement = "Аппроксимировать по семейству ВАХ с учётом температур и погрешности" }, length_m = { measurement = "Аппроксимировать по семейству ВАХ с учётом температур и погрешности" } } }

[parts.switch_module]
kind = "switch_module"
