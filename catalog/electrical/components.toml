d = { contact = "bare", role = "passive" }
g = { contact = "bare", role = "control" }
s = { contact = "bare", role = "return" }

[parts.nmos.elements]
m = { kind = "nmos", nodes = ["d", "g", "s", "s"], parameters = { threshold_v = { measurement = "Сверить порог при паспортном тестовом токе", range = { min = 1.7, nominal = 2.1, max = 2.6, source = { datasheet = "AOS, VGS(th) https://www.aosmd.com/products/mosfets/medium-voltage-mosfets-40v-400v/aod4184a" } } }, kp_a_per_v2 = { measurement = "Аппроксимировать по семейству ВАХ с учётом температур и погрешности" }, lambda_per_v = { measurement = "Аппроксимировать по семейству ВАХ с учётом температур и погрешности" }, is_a = { measurement = "Аппроксимировать по семейству ВАХ с учётом температур и погрешности" }, width_m = { measurement = "Аппроксимировать по семейству ВАХ с учётом температур и погрешности" }, length_m = { measurement = "Аппроксимировать по семейству ВАХ с учётом температур и погрешности" } } }

[parts.nmos.ratings]
