# Неполные параметры требуют источника для конкретной позиции и описанного замера.
# Семейство и позиция контакта подлежат сверке по выбранной детали.
format = 1

[parts.resistor]
kind = "resistor"
source = "Параметризуемый резистор; требуется номинал с допуском выбранной детали"

[parts.resistor.pins]
a = { contact = "bare", role = "passive" }
b = { contact = "bare", role = "passive" }

[parts.resistor.elements]
r = { kind = "resistor", nodes = ["a", "b"], parameters = { ohm = { measurement = "Четырёхпроводный замер сопротивления без питания" } } }

[parts.resistor.ratings]
thermal = { quantity = "power_w", nodes = ["a", "b"], limit = { measurement = "Снять допустимую мощность с кривой дерейтинга" }, conditions = "Температура и способ монтажа выбранной детали" }

[parts.capacitor]
kind = "capacitor"
source = "Ёмкостный эквивалент; выбрать деталь и зафиксировать условия"
model_gap = "Для реальной детали нужны ESR и утечка в рабочем диапазоне"

[parts.capacitor.pins]
a = { contact = "bare", role = "passive" }
b = { contact = "bare", role = "passive" }

[parts.capacitor.elements]
c = { kind = "capacitor", nodes = ["a", "b"], parameters = { farad = { measurement = "Измерить LCR-метром при рабочем смещении и температуре" } } }

[parts.capacitor.ratings]
forward = { quantity = "voltage_v", nodes = ["a", "b"], limit = { measurement = "Уточнить DC-предел по паспорту выбранной детали" }, conditions = "Рабочая температура и частота пульсаций" }

[parts.polar_capacitor]
kind = "polar_capacitor"
source = "Ёмкостный эквивалент; выбрать деталь и зафиксировать условия"
model_gap = "Для реальной детали нужны ESR и утечка в рабочем диапазоне"

[parts.polar_capacitor.pins]
a = { contact = "bare", role = "power" }
b = { contact = "bare", role = "return" }

[parts.polar_capacitor.elements]
c = { kind = "capacitor", nodes = ["a", "b"], parameters = { farad = { measurement = "Измерить LCR-метром при рабочем смещении и температуре" } } }

[parts.polar_capacitor.ratings]
forward = { quantity = "voltage_v", nodes = ["a", "b"], limit = { measurement = "Уточнить DC-предел по паспорту выбранной детали" }, conditions = "Рабочая температура и частота пульсаций" }
reverse = { quantity = "reverse_voltage_v", nodes = ["a", "b"], limit = { measurement = "Уточнить допустимое обратное напряжение по паспорту" }, conditions = "Постоянное напряжение, температура по установке" }

[parts.diode_1n4148]
kind = "diode"
source = "Nexperia 1N4148 https://www.nexperia.com/product/1N4148"
model_gap = "Модель Шокли ограничена прямой ветвью; для обратной нужны утечка и пробой"

[parts.diode_1n4148.pins]
a = { contact = "bare", role = "passive" }
k = { contact = "bare", role = "passive" }

[parts.diode_1n4148.elements]
d = { kind = "diode", nodes = ["a", "k"], parameters = { is_a = { measurement = "Снять прямую и обратную ВАХ при рабочей температуре", range = { min = 2.52e-09, nominal = 2.52e-09, max = 2.52e-09, source = { estimate = "sim-circuit, DIODE_RESISTOR: ориентировочная модель 1N4148" } } }, ideality = { measurement = "Снять прямую и обратную ВАХ при рабочей температуре", range = { min = 1.752, nominal = 1.752, max = 1.752, source = { estimate = "sim-circuit, DIODE_RESISTOR: ориентировочная модель 1N4148" } } }, series_ohm = { measurement = "Снять прямую и обратную ВАХ при рабочей температуре", range = { min = 0.568, nominal = 0.568, max = 0.568, source = { estimate = "sim-circuit, DIODE_RESISTOR: ориентировочная модель 1N4148" } } } } }

[parts.diode_1n4148.ratings]
blocking = { quantity = "voltage_v", nodes = ["k", "a"], limit = { measurement = "Проверить маркировку диода", range = { min = 100.0, nominal = 100.0, max = 100.0, source = { datasheet = "Nexperia 1N4148, continuous reverse voltage https://www.nexperia.com/product/1N4148" } } }, conditions = "Постоянное обратное напряжение; пробой не моделируется" }

[parts.nmos]
kind = "nmos"
source = "AOS AOD4184A, паспорт https://www.aosmd.com/products/mosfets/medium-voltage-mosfets-40v-400v/aod4184a"
model_gap = "Снять ВАХ для калибровки эквивалента и проверить область допустимой работы"

