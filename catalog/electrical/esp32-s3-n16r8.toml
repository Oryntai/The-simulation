format = 1

[parts.esp32_s3_n16r8]
kind = "other"
source = "Espressif ESP32-S3-WROOM-1-N16R8, паспорт ESP32-S3-WROOM-1 & WROOM-1U v1.8, табл. 1-1, 3-1, 6-1 и 6-2 https://documentation.espressif.com/esp32-s3-wroom-1_wroom-1u_datasheet_en.pdf"
model_gap = "Сверить код заказа на экране модуля, ревизию кристалла по eFuse и схему несущей платы. Измерить цепь EN, состояния выводов при включении и сбросе, уровни, утечки, защитные пути и возвраты GND/EPAD."

# Табл. 1-1: flash 16 МБ Quad SPI, PSRAM 8 МБ Octal SPI, температура −40…+65 °C
# без условия повышенного предела при ECC. На модуле антенна PCB (§1.1).
# Табл. 6-2: питание 3,0…3,6 В, тип. 3,3 В, внешний источник должен отдавать
# не менее 0,5 А. Это требование к источнику питания.
# §4, табл. 4-1: загрузочные GPIO0 (подтяжка вверх), GPIO3 (плавающий),
# GPIO45 и GPIO46 (подтяжки вниз). Проверять внешнюю обвязку в момент сброса.
# Номера физических площадок и роли — табл. 3-1; основной адрес возврата — GND, площадка 1.
[parts.esp32_s3_n16r8.pins]
gnd           = { contact = "pad", role = "return" }                    # 1
vdd           = { contact = "pad", role = "power" }                     # 2, 3V3
en            = { contact = "pad", role = { signal_in = "gnd" } }       # 3, высокий уровень включает; не оставлять плавающим
