[parts.esp32_s3_n16r8.elements.supply_load]
kind = "current"
nodes = ["vdd", "gnd"]
parameters.ampere.measurement = "Измерить ток на VDD синхронно с EN и состоянием прошивки: пуск, работа, RF-пики, сон, пробуждение; условия паспортных режимов — §6.4."

[parts.esp32_s3_n16r8.ratings.minimum_supply_voltage]
quantity = "voltage_v"
nodes = ["vdd", "gnd"]
conditions = "Нижняя граница рабочего питания модуля при условиях табл. 6-2 и температуре исполнения N16R8."
limit.measurement = "Снять минимум VDD относительно GND под нагрузкой."
limit.range = { min = 3.0, nominal = 3.0, max = 3.0, source = { datasheet = "Espressif v1.8, табл. 6-2 https://documentation.espressif.com/esp32-s3-wroom-1_wroom-1u_datasheet_en.pdf" } }

