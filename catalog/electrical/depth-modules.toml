# Монтажные модели и открытые параметры. Численные оценки остаются во входах опытов.
format = 1


[parts.cell_1s_candidate]
kind = "battery"
source = "Топология с одной ячейкой следует из эскиза энергии 0,5 А·ч × 3,7 В в setup.toml. Артикул и химия открыты."
model_gap = "Выбрать ячейку. Снять OCV, R и допустимые длительности тока по SOC и температуре в обоих направлениях."
internal_nodes = ["open"]
pins = { p = { contact = "bare", role = "power" }, g = { contact = "bare", role = "return" } }

[parts.cell_1s_candidate.elements]
emf = { kind = "voltage", nodes = ["open", "g"], parameters = { volt = { measurement = "Снять OCV на выбранной ячейке по заряду и температуре." } } }
series = { kind = "resistor", nodes = ["open", "p"], parameters = { ohm = { measurement = "Снять импульсное сопротивление на той же сетке SOC и температур." } } }

[parts.cell_1s_candidate.ratings]
current = { quantity = "current_a", nodes = ["p", "g"], limit = { measurement = "Получить огибающие заряда и разряда по паспорту и замеру." }, conditions = "Конкретная ячейка, SOC и температура" }

[parts.cell_protection]
kind = "other"
source = "Монтажный эскиз. Защита одной ячейки показана в плюсовой ветви с общей опорой. Выбор модуля и расположение ключей открыты."
model_gap = "Подтвердить топологию, распиновку, двустороннюю ВАХ, пороги и выдержки отключения и восстановления. Опыт использует замкнутую ветвь."
pins = { input = { contact = "bare", role = "power" }, output = { contact = "bare", role = "power" }, g = { contact = "bare", role = "return" } }

[parts.cell_protection.elements]
closed = { kind = "resistor", nodes = ["input", "output"], parameters = { ohm = { measurement = "Измерить сопротивление открытых ключей защиты четырёхпроводно при безопасном тестовом токе." } } }

[parts.fuse_inline_candidate]
kind = "other"
source = "Позиция последовательного предохранителя по монтажному эскизу. Семейство-кандидат и кривые см. в catalog/electrical/components.toml, fuse_series."
model_gap = "Выбрать артикул по отключающей способности, напряжению, энергии I²t и фактическому жгуту."
pins = { input = { contact = "pad", role = "power" }, output = { contact = "pad", role = "power" } }

[parts.fuse_inline_candidate.elements]
closed = { kind = "resistor", nodes = ["input", "output"], parameters = { ohm = { measurement = "Измерить холодное сопротивление предохранителя и держателя." } }, continuity = true }

[parts.fuse_inline_candidate.ratings]
current = { quantity = "current_a", nodes = ["input", "output"], limit = { measurement = "Сверить номинал и кривую отключения с жгутом." }, conditions = "Артикул, держатель и температура" }

[parts.motor_boost]
kind = "switching_regulator"
source = "Монтажный эскиз: повышение от одной ячейки до номинальной шины двигателя по паспорту Pololu #2214 https://www.pololu.com/product/2214. Модуль и фильтр не выбраны."
model_gap = "Измерить Vin/Iin, Vout/Iout, пуск, токоограничение, C/ESR и обратный ток. Диагностический выход Тевенина питается независимо от входа и может поглощать энергию."
internal_nodes = ["regulated"]
pins = { input = { contact = "terminal", role = "power" }, output = { contact = "terminal", role = "power" }, g = { contact = "terminal", role = "return" } }

[parts.motor_boost.elements]
emf = { kind = "voltage", nodes = ["regulated", "g"], parameters = { volt = { measurement = "Снять выходное напряжение и его режимы, включая запрещённый обратный ток и выключение." } } }
series = { kind = "resistor", nodes = ["regulated", "output"], parameters = { ohm = { measurement = "Снять выходной импеданс по фронту нагрузки и при возврате энергии." } } }
input = { kind = "resistor", nodes = ["input", "g"], parameters = { ohm = { measurement = "Снять входную ВАХ с реальной выходной нагрузкой и при выключении." } } }
filter = { kind = "capacitor", nodes = ["output", "g"], parameters = { farad = { measurement = "Подтвердить эффективную выходную ёмкость, ESR и утечку в рабочем диапазоне." } } }

[parts.motor_boost.ratings]
output = { quantity = "current_a", nodes = ["output", "g"], limit = { measurement = "Уточнить допустимый выходной ток и длительность по Vin и температуре." }, conditions = "Минимальное Vin под нагрузкой и фактическое охлаждение" }

[parts.motor_h_bridge]
kind = "switch_module"
source = "Функциональные клеммы коллекторного Н-моста из двуполярной команды ШИМ control.toml. ШИМ/направление/разрешение являются проектной распиновкой."
model_gap = "Выбрать мост и защиту. Снять ВАХ, пуск, межключевые паузы, сброс, порог отключения, торможение и выбросы. Живой опыт связывает только шину DC; выходы A/B оставлены без коммутации."

[parts.motor_h_bridge.pins]
p = { contact = "terminal", role = "power" }
g = { contact = "terminal", role = "return" }
pwm = { contact = "pad", role = { signal_in = "g" } }
dir = { contact = "pad", role = { signal_in = "g" } }
enable = { contact = "pad", role = { signal_in = "g" } }
a = { contact = "terminal", role = "passive" }
b = { contact = "terminal", role = "passive" }

[parts.motor_h_bridge.elements]
dc_load = { kind = "current", nodes = ["p", "g"], parameters = { ampere = { measurement = "Записать знаковый ток шины вместе с напряжением в пуске, реверсе, останове и отказах." } } }
pwm_input = { kind = "resistor", nodes = ["pwm", "g"], parameters = { ohm = { measurement = "Измерить вход ШИМ, уровень, ток и состояние при отключении." } } }
dir_input = { kind = "resistor", nodes = ["dir", "g"], parameters = { ohm = { measurement = "Измерить вход направления в обоих состояниях питания." } } }
enable_input = { kind = "resistor", nodes = ["enable", "g"], parameters = { ohm = { measurement = "Снять вход разрешения, порог и состояние при обесточенном контроллере." } } }
off_a = { kind = "resistor", nodes = ["a", "g"], parameters = { ohm = { measurement = "Снять пути утечки и защитные пути выхода A выключенного моста." } } }
off_b = { kind = "resistor", nodes = ["b", "g"], parameters = { ohm = { measurement = "Снять пути утечки и защитные пути выхода B выключенного моста." } } }

[parts.motor_h_bridge.ratings]
bus = { quantity = "current_a", nodes = ["p", "g"], limit = { measurement = "Получить пределы питающего и обратного тока, температуры и времени для выбранного моста." }, conditions = "Отдельно пуск, заклинивание, реверс и выбег" }

[parts.motor_controller]
kind = "other"
source = "Контроллер на защищённой шине ячейки в монтажном эскизе. Исполнительный опыт берёт команду из файла стимулов."
model_gap = "Выбрать контроллер и его питание. Подтвердить уровни, распиновку, сброс, сторож, безопасные состояния выходов и независимое снятие разрешения."

[parts.motor_controller.pins]
p = { contact = "bare", role = "power" }
g = { contact = "bare", role = "return" }
pwm = { contact = "pad", role = { signal_out = "g" } }
dir = { contact = "pad", role = { signal_out = "g" } }
enable = { contact = "pad", role = { signal_out = "g" } }

[parts.motor_controller.elements]
load = { kind = "resistor", nodes = ["p", "g"], parameters = { ohm = { measurement = "Снять ток питания по режимам и при провале напряжения." } } }

[parts.pololu_2214]
kind = "other"
source = "Pololu #2214, HP 6 В, холостой ход 0,10 А, стоповый ток 1,60 А экстраполирован https://www.pololu.com/product/2214. A/B обозначают выводы обмотки, полярность меняется мостом."
model_gap = "Снять R(T) и L по положениям ротора, пуск и реверс, обратную ЭДС и нагрев. Обмотка в монтажном графе пассивная, живой ток приходит из электромеханической модели device.toml."
internal_nodes = ["winding"]
pins = { a = { contact = "pad", role = "passive" }, b = { contact = "pad", role = "passive" } }

[parts.pololu_2214.elements]
copper = { kind = "resistor", nodes = ["a", "winding"], parameters = { ohm = { measurement = "Измерить сопротивление обмотки по положениям ротора и температуре." } } }
inductance = { kind = "inductor", nodes = ["winding", "b"], parameters = { henry = { measurement = "Снять LCR или короткую ступень тока на разных положениях ротора." } } }

[parts.pololu_2214.ratings]
winding = { quantity = "current_a", nodes = ["a", "b"], limit = { measurement = "Определить огибающую тока по длительности и температуре. 0,40 А — численный длительный предел из device.toml, 1,60 А — экстраполяция, а не разрешённый стоповый ток." }, conditions = "Конкретный двигатель и монтаж, раздельно длительный и импульсный режим" }

[parts.flexible_harness_wire]
kind = "wire"
source = "Гибкая жила по монтажному эскизу. Марка, длина и сечение открыты."
model_gap = "Подтвердить фиксацию на подвижном узле, радиус изгиба, циклическую стойкость и нагрев в собранном жгуте."
pins = { a = { contact = "bare", role = "passive" }, b = { contact = "bare", role = "passive" } }

[parts.flexible_harness_wire.elements]
copper = { kind = "resistor", nodes = ["a", "b"], parameters = { ohm = { measurement = "Четырёхпроводно измерить сопротивление жилы в прямом и согнутом положении." } }, continuity = true }

[parts.flexible_harness_wire.ratings]
current = { quantity = "current_a", nodes = ["a", "b"], limit = { measurement = "Сверить допустимые ток и нагрев по сечению, изоляции и прокладке." }, conditions = "Собранный жгут, ожидаемая температура и интервалы нагрузки" }

[parts.as5600_fixture_supply]
kind = "bench_supply"
source = "Отдельный стендовый источник для питания AS5600. Номинал по рис. 6 и 13 паспорта ams v1-06. Артикул источника не задан."
internal_nodes = ["emf"]
model_gap = "Замерить выходную ВАХ, активный разряд и ток пуска. Ступени профиля задают диагностический активный переход источника."

[parts.as5600_fixture_supply.pins]
plus = { contact = "terminal", role = "power" }
minus = { contact = "terminal", role = "return" }

[parts.as5600_fixture_supply.elements]
emf = { kind = "voltage", nodes = ["emf", "minus"], parameters = { volt = { measurement = "Снять напряжение холостого хода при заданных условиях" } } }
internal = { kind = "resistor", nodes = ["emf", "plus"], parameters = { ohm = { measurement = "Измерить падение на ступени тока" } } }

[parts.as5600_fixture_supply.ratings]
output = { quantity = "current_a", nodes = ["plus", "minus"], limit = { measurement = "По паспорту или нагрузочным тестом определить порог и длительность тока" }, conditions = "Ограничение, температура и состояние источника для опыта" }

[parts.dc_hbridge_unspecified]
kind = "switch_module"
source = "Функциональный мост двухпроводного двигателя из device.toml и stage6-device.toml. Артикул, разводка и драйвер отсутствуют."
model_gap = "Выбрать мост с защитой и путём энергии при торможении. Снять EN, PWM, направление, VM, напряжения OUT1/OUT2 и токи при пуске, реверсе, заклинивании и снятии EN. Эквивалент только отражает знаковый ток модели привода на VM и не воспроизводит ключи, коммутацию и пороги."

[parts.dc_hbridge_unspecified.pins]
p = { contact = "bare", role = "power" }
g = { contact = "bare", role = "return" }
out1 = { contact = "bare", role = "passive" }
out2 = { contact = "bare", role = "passive" }
en = { contact = "bare", role = { signal_in = "g" } }
pwm = { contact = "bare", role = { signal_in = "g" } }
dir = { contact = "bare", role = { signal_in = "g" } }

[parts.dc_hbridge_unspecified.elements]
dc_load = { kind = "current", nodes = ["p", "g"], parameters = { ampere = { measurement = "Снять знаковый входной ток моста относительно его VM и GND. В живом опыте это порт тока двигателя." } } }

pwm_idle = { kind = "resistor", nodes = ["pwm", "g"], parameters = { ohm = { measurement = "Снять входной импеданс вывода по состояниям питания." } } }
dir_idle = { kind = "resistor", nodes = ["dir", "g"], parameters = { ohm = { measurement = "Снять входной импеданс вывода по состояниям питания." } } }
en_idle = { kind = "resistor", nodes = ["en", "g"], parameters = { ohm = { measurement = "Снять входной импеданс вывода по состояниям питания." } } }
out1_idle = { kind = "resistor", nodes = ["out1", "g"], parameters = { ohm = { measurement = "Снять импеданс отключённого плеча относительно GND и измерить обратные токи." } } }
out2_idle = { kind = "resistor", nodes = ["out2", "g"], parameters = { ohm = { measurement = "Снять импеданс отключённого плеча относительно GND и измерить обратные токи." } } }

[parts.dc_hbridge_unspecified.ratings]
vm = { quantity = "voltage_v", nodes = ["p", "g"], limit = { measurement = "По паспорту выбранного моста определить рабочий диапазон VM и переходный максимум." }, conditions = "Пуск, реверс, останов и регенерация, с реальным ограничителем." }
output = { quantity = "current_a", nodes = ["out1", "out2"], limit = { measurement = "Подтвердить огибающую допустимого тока и длительность импульса при фактическом теплоотводе." }, conditions = "Паспорт моста, температура и теплоотвод экземпляра." }

[parts.pololu_2214_brushed]
kind = "other"
source = "Pololu #2214, номинал 6 В, холостой ход 100 мА, экстраполированный стоповый ток 1,60 А. https://www.pololu.com/product/2214"
model_gap = "Снять R(T), индуктивность, ток пуска и реверса. Ток на входе моста поступает из sim-drive: выходная ветвь в численном опыте пассивна, коммутация и выбег реального моста требуют осциллограммы."
internal_nodes = ["winding"]

[parts.pololu_2214_brushed.pins]
m1 = { contact = "pad", role = "passive" }
m2 = { contact = "pad", role = "passive" }

[parts.pololu_2214_brushed.elements]
winding_r = { kind = "resistor", nodes = ["m1", "winding"], parameters = { ohm = { measurement = "Четырёхпроводно снять сопротивление по положениям ротора и температурам." } } }
winding_l = { kind = "inductor", nodes = ["winding", "m2"], parameters = { henry = { measurement = "Снять переход тока неподвижной обмотки коротким импульсом или измерить LCR-метром." } } }

[parts.pololu_2214_brushed.ratings]
winding = { quantity = "current_a", nodes = ["m1", "m2"], limit = { measurement = "Снять длительно допустимый ток и допустимое время пусковой перегрузки по температуре обмотки." }, conditions = "Стоповый ток в паспорте экстраполирован. Предел защиты и тепловая огибающая экземпляра требуют замера." }

[parts.external_control_unspecified]
kind = "other"
source = "control.toml и stage6-control.toml: вычисления на хосте, синтетический RGB в stdin/stdout, цифровая команда привода. Местный физический контроллер и внешний вычислитель не выбраны."
model_gap = "Выбрать контроллер I²C и моста, способ подключения хоста и его питание. Снять профили токов местного контроллера и хоста, уровни GPIO при сбросе, а также сквозную задержку от экспозиции до PWM. Выводы здесь обозначают функции, распиновка требует паспорта."

[parts.external_control_unspecified.pins]
p = { contact = "bare", role = "power" }
g = { contact = "bare", role = "return" }
en = { contact = "bare", role = { signal_out = "g" } }
pwm = { contact = "bare", role = { signal_out = "g" } }
dir = { contact = "bare", role = { signal_out = "g" } }
sda = { contact = "bare", role = { signal_io = "g" } }
scl = { contact = "bare", role = { signal_out = "g" } }
camera_data = { contact = "bare", role = { signal_in = "g" } }

[parts.external_control_unspecified.ratings]
supply = { quantity = "current_a", nodes = ["p", "g"], limit = { measurement = "Определить требования к питанию выбранной платы и хоста. Замерить токи при загрузке, измерении, обработке кадра и отказе связи." }, conditions = "Конкретная конфигурация и ревизия, штатная нагрузка и момент запуска." }

[parts.rgb_rails_unspecified]
kind = "other"
source = "reference-rgb описывает синтетический кадр. Пины VDD, VDDIO и data обозначают функции для выбора модуля и проверки его интерфейса."
model_gap = "Выбрать модуль камеры, паспорт и разъём. Установить состав шин, уровни и порядок подачи, топологию возвратов и интерфейс (в том числе вариант со встроенными стабилизаторами). Снять VDD/VDDIO и ток покоя, пуска, захвата и передачи. Камера и внешний контроллер остаются обесточенными физическими нагрузками данного расчёта."

[parts.rgb_rails_unspecified.pins]
vdd = { contact = "bare", role = "power" }
vddio = { contact = "bare", role = "power" }
g = { contact = "bare", role = "return" }
data = { contact = "bare", role = { signal_out = "g" } }

[parts.rgb_rails_unspecified.ratings]
vdd = { quantity = "voltage_v", nodes = ["vdd", "g"], limit = { measurement = "Установить рабочий диапазон и последовательность подачи питания ядра по модулю." }, conditions = "Шина VDD, если она выведена на выбранном модуле." }
vddio = { quantity = "voltage_v", nodes = ["vddio", "g"], limit = { measurement = "Установить допуск VDDIO и предел инжекции при выключенном VDD." }, conditions = "Шина VDDIO, если она выведена на выбранном модуле." }

[parts.as5600_bare_3v3]
kind = "other"
source = "ams AS5600 v1-06, рис. 4, 6, 13 и 38: питание 3,0–3,6 В, VDD5V и VDD3V3 вместе, отдельного VDDIO нет. https://files.seeedstudio.com/wiki/Grove-12-bit-Magnetic-Rotary-Position-Sensor-AS5600/res/Magnetic%20Rotary%20Position%20Sensor%20AS5600%20Datasheet.pdf"
model_gap = "Проверить ревизию модуля, перемычки VDD, стартовый пик, ток режима NOM с обменом, напряжения и фронты I²C, захват магнита и время первой валидной выборки. Опыт без программирования OTP. Сопротивление отражает одну паспортную точку, не переходы микросхемы."

[parts.as5600_bare_3v3.pins]
vdd5v = { contact = "pad", role = "power" }
vdd3v3 = { contact = "pad", role = "power" }
g = { contact = "pad", role = "return" }
sda = { contact = "pad", role = { signal_io = "g" } }
scl = { contact = "pad", role = { signal_in = "g" } }
dir = { contact = "pad", role = "control" }
pgo = { contact = "pad", role = "control" }
out = { contact = "pad", role = "passive" }

[parts.as5600_bare_3v3.elements]
idd = { kind = "resistor", nodes = ["vdd5v", "g"], parameters = { ohm = { measurement = "Замерить ток при включении и в NOM, с фактической нагрузкой I²C и магнитом, в диапазоне напряжения и температуры." } } }

[parts.as5600_bare_3v3.ratings]
supply = { quantity = "voltage_v", nodes = ["vdd5v", "g"], limit = { measurement = "Проверить напряжения обоих объединённых контактов на экземпляре.", range = { min = 3.6, nominal = 3.6, max = 3.6, source = { datasheet = "ams AS5600 v1-06, рис. 6: верхняя граница рабочего диапазона 3,3-В режима. https://files.seeedstudio.com/wiki/Grove-12-bit-Magnetic-Rotary-Position-Sensor-AS5600/res/Magnetic%20Rotary%20Position%20Sensor%20AS5600%20Datasheet.pdf" } } }, conditions = "Рис. 13: выводы VDD3V3 и VDD5V объединены. Без OTP." }

[parts.as5600_pullup_unspecified]
