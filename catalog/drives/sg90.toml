# Паспортные значения перенесены из sim-actuators.
# Режим выбран для модели; настройки регулятора и монтажа задаются отдельно.
id = "sg90"
name = "SG90 (9 г)"
what_is = "Самая дешёвая пластиковая микросерва: флажки и лёгкие заслонки, нагрузку руки не держит."
kind = "hobby_servo"
legacy_class = "hobby_servo"
mode = "position"
inertia = "internal"
backdrive = "unknown"
brake = "unknown"
stop = "unknown"
magnet = "unknown"
builtin_driver = "builtin-hobby-servo"
sources = ["TowerPro SG90 Analog: https://towerpro.com.tw/product/sg90-analog/", "листок SG90: https://dac70r.github.io/ELEC3300/Labs/SG90.pdf", "копия листка TowerPro с 1.2 кгс·см при 4.8 В: https://bit.nkust.edu.tw/~csshieh/teach/111A/mc/datasheet/SG90.pdf", "Protosupplies, замер SG90: https://protosupplies.com/product/servo-motor-micro-sg90/", "форум Arduino, стоповый ток 650 ± 80 мА: https://forum.arduino.cc/t/how-much-power-supply-do-i-need-for-controlling-5-sg90-9g-microservo/627666"]
caveats = ["TowerPro указывает 1.8 кгс·см при 4.8 В, в другом листке 1.2 кгс·см: берём 1.2.", "Для напряжения берём 4.8 В с сайта TowerPro, хотя продавцы указывают до 6 В.", "Партии заметно различаются, шестерни пластиковые.", "Стоповый ток: от 360 мА (замер Protosupplies) до 650 ± 80 мА; для питания берём 730 мА."]

