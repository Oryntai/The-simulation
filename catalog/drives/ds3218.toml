legacy_class = "hobby_servo"
mode = "position"
inertia = "internal"
backdrive = "unknown"
brake = "unknown"
stop = "unknown"
magnet = "unknown"
builtin_driver = "builtin-hobby-servo"
sources = ["DSSERVO, паспорт DS3218: https://www.dsservo.com/d_file/DS3218%20datasheet.pdf", "DIYmall DS3218 (18 кгс·см при 5 В): https://manuals.plus/asin/B07FMBBPD2", "DSSERVO DS3218, листинг: https://rcdrone.top/products/dsservo-ds3218-digital-servo", "листинг DS3218 MG, 2.6 А: https://www.zennixtek.com/products/dsservo-ds3218-mg-servo-motor"]
