# Профиль потребления МК. Формат 1, отдельный от профиля контактов и сброса.
# Каждая строка задаёт одну конфигурацию. Между конфигурациями ток не интерполируется.
# Пики Wi-Fi измерены при 3,3 В и 25 °C, для TX скважность составляет 100 % включения.
# Типовые значения и измеренные пики не задают огибающую, в том числе на переходах.
# Для BLE, других частот, произвольной периферии и доступа к flash полных строк нет.
format = 1
board = "esp32-c3"
datasheet = "Espressif ESP32-C3 Series Datasheet v2.5, https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"

