version = 1

[[controller]]
name = "компьютер"
kind = "external"
rate_hz = 100
# Собирается в общую target симулятора: см. README.
program = "../../target/debug/claude-arm-controller"
# Аргументы пишет tools/make_pick.py: как в control.toml плюс выход схвата и ход губы в каждой точке.
args = ["65536", "20000000", "20000000", "$input:рука/энкодер-поворота/value", "рука/энкодер-поворота/value", "rad", "$input:рука/энкодер-плеча/value", "рука/энкодер-плеча/value", "rad", "$input:рука/энкодер-локтя/value", "рука/энкодер-локтя/value", "rad", "$input:рука/энкодер-запястья/value", "рука/энкодер-запястья/value", "rad", "$input:рука/энкодер-вращения/value", "рука/энкодер-вращения/value", "rad", "$output:поворот", "поворот", "rad", "$output:плечо", "плечо", "rad", "$output:локоть", "локоть", "rad", "$output:запястье", "запястье", "rad", "$output:вращение", "вращение", "rad", "1", "$output:схват", "схват", "m", "0.1", "0.12", "0.12", "0.1075", "-150", "150", "-15", "95", "-20", "150", "-110", "110", "-170", "170", "14", "1.0", "0.16", "0.06", "0.08", "180", "0", "0.0", "1.5", "0.16", "0.06", "0.08", "180", "0", "0.0", "2.3", "0.16", "0.06", "0.02", "180", "0", "0.0", "2.6", "0.16", "0.06", "0.02", "180", "0", "0.0", "3.2", "0.16", "0.06", "0.02", "180", "0", "0.016", "3.5", "0.16", "0.06", "0.02", "180", "0", "0.016", "4.3", "0.16", "0.06", "0.08", "180", "0", "0.016", "5.3", "0.16", "-0.06", "0.08", "180", "0", "0.016", "6.1", "0.16", "-0.06", "0.02", "180", "0", "0.016", "6.4", "0.16", "-0.06", "0.02", "180", "0", "0.016", "6.9", "0.16", "-0.06", "0.02", "180", "0", "0.0", "7.2", "0.16", "-0.06", "0.02", "180", "0", "0.0", "8.0", "0.16", "-0.06", "0.08", "180", "0", "0.0", "8.5", "0.16", "-0.06", "0.08", "180", "0", "0.0"]
input_latency_ns = 2000000
input_jitter_ns = 500000
output_latency_ns = 1000000
output_jitter_ns = 500000
request_hz = 1000
request_max_age_ns = 20000000
queue_capacity = 16
max_message_bytes = 65536
source = "Компьютер с Claude шлёт задания углов и хода губы по шине 1 Мбит/с через USB-UART; задержки — оценка до замера."

[[input]]
controller = "компьютер"
signal = "рука/энкодер-поворота/value"
unit = "rad"
kind = "scalar"
max_age_ns = 20000000
source = "Опрос энкодера сервы по шине, срок два такта по 10 мс."

[[input]]
controller = "компьютер"
signal = "рука/энкодер-плеча/value"
unit = "rad"
kind = "scalar"
max_age_ns = 20000000
source = "Опрос энкодера сервы по шине, срок два такта по 10 мс."

[[input]]
controller = "компьютер"
signal = "рука/энкодер-локтя/value"
unit = "rad"
kind = "scalar"
max_age_ns = 20000000
source = "Опрос энкодера сервы по шине, срок два такта по 10 мс."

[[input]]
controller = "компьютер"
signal = "рука/энкодер-запястья/value"
unit = "rad"
kind = "scalar"
max_age_ns = 20000000
source = "Опрос энкодера сервы по шине, срок два такта по 10 мс."

[[input]]
controller = "компьютер"
signal = "рука/энкодер-вращения/value"
unit = "rad"
kind = "scalar"
max_age_ns = 20000000
source = "Опрос энкодера сервы по шине, срок два такта по 10 мс."

[[output]]
name = "поворот"
controller = "компьютер"
target = "рука/поворот"
target_kind = "drive"
unit = "rad"
ack = "рука/серва-поворота/accepted_command"
max_age_ns = 20000000
# Шинная серва при пропуске команды держит последнее принятое задание.
fallback = "hold"
source = "Задание сервы. Резерв — последнее ушедшее задание."

