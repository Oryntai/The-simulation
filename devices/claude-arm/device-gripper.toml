[drives.params]
# Поворот основания напрямую, ±150°.
# Паспорт C018 (catalog/drives/feetech-sts3215-12v-c018.toml): U=12 В, Istall=2.7 А,
# Tstall=2.941995 Н·м, 45 об/мин без нагрузки. Мост без падения: R=U/Istall.
resistance_ohm = 4.444444444444444
# Ток защиты штатной прошивки неизвестен, предел опыта равен Istall.
current_limit_a = 2.7
# Индуктивность не следует из паспорта. Оценка: L/R = 0.1 мс, нужен LCR-метр.
inductance_h = 0.000444444444444
# Передаточное число 1:345 по маркировке C018 в заметках владельца (ARM.md), не по паспорту.
gear_ratio = 345.0
# I0 ≈ Istall·0.066/0.91 (та же гипотеза, что у MG90S), k=(U−R·I0)/(N·ω0).
motor_constant = 0.006845766368889806
# η=Tstall/(Istall·k·N). Обратный КПД принят равным прямому, это допущение.
gear_efficiency = 0.46135687586652463
backward_efficiency = 0.46135687586652463
# B=k·I0/(N·ω0). Сухое трение не выделить из двух паспортных точек.
viscous_nm_per_rad_s = 8.245711849345113e-7
coulomb_nm = 0.0
static_friction_nm = 0.0
stribeck_rad_s = 1625.774198232718
friction_band_rad_s = 1625.774198232718
# Инерция ротора — оценка 3e-8 кг·м² для 12-вольтового мотора ~20 мм, нужен разгонный опыт.
