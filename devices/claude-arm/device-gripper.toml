# Рука Claude со схватом, эскиз 1. Пять суставов и схват на Feetech STS3215-C018 12 В.
# Плечо через ремень 1:3, локоть через ремень 1:2 с сервой у плеча (масса сервы в звене «плечо»), запястье и вращение напрямую.
