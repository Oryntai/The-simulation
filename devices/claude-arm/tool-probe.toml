# Щуп: стальной стержень 8 мм со сферой 6 мм на конце, 45 мм от фланца до центра сферы.
# Ось z насадки направлена от фланца руки. Хвостовик начинается в 1 мм от фланца, чтобы
# замкнутый стык не давил насадку в кисть. Размеры и массы — эскиз, не чертёж.
format = 3
name = "щуп"

[[links]]
name = "основание"

[links.joint]
kind = "free"
name = "основание"
damping = 0.0
friction_loss = 0.0
armature = 0.0

[links.mass]
kind = "explicit"
mass_kg = 0.015
com_m = [0.0, 0.0, 0.02]
inertia_kg_m2 = [2.8e-06, 2.8e-06, 1e-06, 0.0, 0.0, 0.0]
provenance = { estimate = "PLA и сталь по эскизу, не взвешено" }

