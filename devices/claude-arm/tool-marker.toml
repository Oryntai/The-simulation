# Маркер: корпус 10 мм, пишущий узел 3 мм, 55 мм от фланца до центра узла.
# Ось z насадки направлена от фланца руки. Хвостовик начинается в 1 мм от фланца, чтобы
# замкнутый стык не давил насадку в кисть. Размеры и массы — эскиз, не чертёж.
# Узел жёсткий. Подпружиненный узел на ползуне (2 г) пробовали: мягкость ограничений MuJoCo по
# умолчанию масштабируется массой тела, и упор ползуна под прижимом 1.6 Н уходил на 6 мм, а
# задать жёсткость упора в файле устройства нельзя (README, «Сменные насадки»).
format = 3
name = "маркер"

[[links]]
name = "основание"

[links.joint]
kind = "free"
name = "основание"
damping = 0.0
friction_loss = 0.0
armature = 0.0

[links.mass]
kind = "explicit"
mass_kg = 0.02
com_m = [0.0, 0.0, 0.025]
inertia_kg_m2 = [5.4e-06, 5.4e-06, 1.3e-06, 0.0, 0.0, 0.0]
provenance = { estimate = "PLA и пластик корпуса маркера по эскизу, не взвешено" }

