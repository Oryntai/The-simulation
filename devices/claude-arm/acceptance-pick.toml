version = 1
control = "control-pick.toml"
profile = "profile-pick.toml"

[[modes]]
id = "перенос"
horizon_ns = 9000000000
before_ns = 100000000
after_ns = 300000000
max_gap_ns = 2000000
source = { kind = "derived", reference = "Подвести, опустить, сжать, поднять, перенести на 120 мм, поставить, разжать, отойти." }
# Лёгкий толчок по плечу после отхода: проверка, что рука держит позу.
excitation = "толчок"
stimuli = [
  { id = "толчок", signal = { name = "рука/толчок-плеча", unit = "N*m" }, at_ns = 8600000000, value = 0.1, comparison_value = 0.0, source = { kind = "estimate", reference = "Касание рукой человека." } },
]

[[criteria]]
case = { path = "поворот", mode = "перенос" }
limits = [{ kind = "range", signal = { name = "угол поворот", unit = "rad" }, min = -2.6179938779914944, max = 2.6179938779914944, source = { kind = "estimate", reference = "Рабочий диапазон сустава по эскизу." } }, { kind = "range", signal = { name = "кубик z", unit = "m" }, min = 0.0, max = 0.2, source = { kind = "estimate", reference = "Кубик не проваливается под стол и не улетает." } }, { kind = "range", signal = { name = "кубик x", unit = "m" }, min = 0.0, max = 0.4, source = { kind = "estimate", reference = "Кубик остаётся на столе перед рукой." } }, { kind = "range", signal = { name = "кубик y", unit = "m" }, min = -0.2, max = 0.2, source = { kind = "estimate", reference = "Кубик остаётся на столе перед рукой." } }]

