version = 1

[[controller]]
name = "компьютер"
kind = "external"
rate_hz = 100
# Собирается в общую target симулятора: см. README.
program = "../../target/debug/claude-arm-controller"
# Аргументы пишет tools/make_tools.py: как в control.toml, плюс выход замка (2) с командой 0/1 в каждой точке
# и режим «прямые»: фланец идёт между точками по отрезку.
args = ["65536", "20000000", "20000000", "$input:рука/энкодер-поворота/value", "рука/энкодер-поворота/value", "rad", "$input:рука/энкодер-плеча/value", "рука/энкодер-плеча/value", "rad", "$input:рука/энкодер-локтя/value", "рука/энкодер-локтя/value", "rad", "$input:рука/энкодер-запястья/value", "рука/энкодер-запястья/value", "rad", "$input:рука/энкодер-вращения/value", "рука/энкодер-вращения/value", "rad", "$output:поворот", "поворот", "rad", "$output:плечо", "плечо", "rad", "$output:локоть", "локоть", "rad", "$output:запястье", "запястье", "rad", "$output:вращение", "вращение", "rad", "2", "$output:замок", "замок", "1", "0.1", "0.12", "0.12", "0.07", "-150", "150", "-15", "95", "-20", "150", "-110", "110", "-170", "170", "20", "1.2", "0.16", "0.08", "0.14", "180", "0", "0", "1.5", "0.16", "0.08", "0.14", "180", "0", "0", "2.1", "0.16", "0.08", "0.075", "180", "0", "0", "2.6", "0.16", "0.08", "0.075", "180", "0", "1", "2.9", "0.16", "0.08", "0.075", "180", "0", "1", "3.5", "0.16", "0.08", "0.14", "180", "0", "1", "4.2", "0.21", "-0.03", "0.075", "180", "0", "1", "4.3", "0.21", "-0.03", "0.075", "180", "0", "1", "4.6", "0.21", "-0.03", "0.0555", "180", "0", "1", "4.8", "0.21", "-0.03", "0.0555", "180", "0", "1", "7.3", "0.21", "0.03", "0.0555", "180", "0", "1", "7.9", "0.21", "0.03", "0.0555", "180", "0", "1", "8.2", "0.21", "0.03", "0.075", "180", "0", "1", "8.9", "0.16", "0.08", "0.14", "180", "0", "1", "9.2", "0.16", "0.08", "0.14", "180", "0", "1", "9.8", "0.16", "0.08", "0.075", "180", "0", "1", "10.3", "0.16", "0.08", "0.075", "180", "0", "0", "10.6", "0.16", "0.08", "0.075", "180", "0", "0", "11.2", "0.16", "0.08", "0.14", "180", "0", "0", "11.5", "0.16", "0.08", "0.14", "180", "0", "0", "прямые"]
input_latency_ns = 2000000
input_jitter_ns = 500000
output_latency_ns = 1000000
output_jitter_ns = 500000
request_hz = 1000
request_max_age_ns = 20000000
queue_capacity = 16
max_message_bytes = 65536
source = "Компьютер с Claude шлёт задания углов и команду замка по шине 1 Мбит/с через USB-UART; задержки — оценка до замера."

[[input]]
controller = "компьютер"
signal = "рука/энкодер-поворота/value"
unit = "rad"
kind = "scalar"
max_age_ns = 20000000
source = "Опрос энкодера сервы по шине, срок два такта по 10 мс."

[[input]]
controller = "компьютер"
signal = "рука/энкодер-плеча/value"
unit = "rad"
kind = "scalar"
max_age_ns = 20000000
source = "Опрос энкодера сервы по шине, срок два такта по 10 мс."

[[input]]
controller = "компьютер"
signal = "рука/энкодер-локтя/value"
unit = "rad"
kind = "scalar"
max_age_ns = 20000000
source = "Опрос энкодера сервы по шине, срок два такта по 10 мс."

[[input]]
controller = "компьютер"
signal = "рука/энкодер-запястья/value"
unit = "rad"
kind = "scalar"
max_age_ns = 20000000
source = "Опрос энкодера сервы по шине, срок два такта по 10 мс."

[[input]]
controller = "компьютер"
signal = "рука/энкодер-вращения/value"
unit = "rad"
kind = "scalar"
max_age_ns = 20000000
source = "Опрос энкодера сервы по шине, срок два такта по 10 мс."

[[output]]
name = "поворот"
controller = "компьютер"
target = "рука/поворот"
target_kind = "drive"
unit = "rad"
ack = "рука/серва-поворота/accepted_command"
max_age_ns = 20000000
# Шинная серва при пропуске команды держит последнее принятое задание.
fallback = "hold"
source = "Задание угла сервы. Резерв — последнее ушедшее задание."

[[output]]
name = "плечо"
controller = "компьютер"
target = "рука/плечо"
target_kind = "drive"
unit = "rad"
ack = "рука/серва-плеча/accepted_command"
max_age_ns = 20000000
# Шинная серва при пропуске команды держит последнее принятое задание.
fallback = "hold"
source = "Задание угла сервы. Резерв — последнее ушедшее задание."

[[output]]
name = "локоть"
controller = "компьютер"
target = "рука/локоть"
target_kind = "drive"
unit = "rad"
ack = "рука/серва-локтя/accepted_command"
max_age_ns = 20000000
# Шинная серва при пропуске команды держит последнее принятое задание.
fallback = "hold"
source = "Задание угла сервы. Резерв — последнее ушедшее задание."

[[output]]
name = "запястье"
controller = "компьютер"
target = "рука/запястье"
target_kind = "drive"
unit = "rad"
ack = "рука/серва-запястья/accepted_command"
max_age_ns = 20000000
# Шинная серва при пропуске команды держит последнее принятое задание.
fallback = "hold"
source = "Задание угла сервы. Резерв — последнее ушедшее задание."

[[output]]
name = "вращение"
controller = "компьютер"
target = "рука/вращение"
target_kind = "drive"
unit = "rad"
ack = "рука/серва-вращения/accepted_command"
max_age_ns = 20000000
# Шинная серва при пропуске команды держит последнее принятое задание.
fallback = "hold"
source = "Задание угла сервы. Резерв — последнее ушедшее задание."

# Команда замка сменщика насадок: 1 — закрыть, 0 — открыть. Её читает процесс «сменщик» (case-marker.toml).
[[output]]
name = "замок"
controller = "компьютер"
target = "рука/замок"
target_kind = "goal"
unit = "1"
max_age_ns = 20000000
source = "Клапан замка на той же шине. Без свежей команды замок остаётся в прежнем положении."
