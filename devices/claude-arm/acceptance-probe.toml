limits = [{ kind = "range", signal = { name = "угол плечо", unit = "rad" }, min = -0.2617993877991494, max = 1.6580627893946132, source = { kind = "estimate", reference = "Рабочий диапазон сустава по эскизу." } }, { kind = "range", signal = { name = "щуп кончик z", unit = "m" }, min = 0.001, max = 0.3, source = { kind = "estimate", reference = "Наконечник не входит в стол глубже 2 мм и не улетает." } }, { kind = "range", signal = { name = "щуп x", unit = "m" }, min = 0.0, max = 0.4, source = { kind = "estimate", reference = "Насадка остаётся над столом перед рукой." } }, { kind = "range", signal = { name = "щуп y", unit = "m" }, min = -0.2, max = 0.2, source = { kind = "estimate", reference = "Насадка остаётся над столом перед рукой." } }, { kind = "range", signal = { name = "щуп z", unit = "m" }, min = 0.0, max = 0.3, source = { kind = "estimate", reference = "Насадка не падает со стола и не улетает." } }, { kind = "range", signal = { name = "маркер кончик z", unit = "m" }, min = -0.0005, max = 0.3, source = { kind = "estimate", reference = "Наконечник не входит в стол глубже 2 мм и не улетает." } }, { kind = "range", signal = { name = "маркер x", unit = "m" }, min = 0.0, max = 0.4, source = { kind = "estimate", reference = "Насадка остаётся над столом перед рукой." } }, { kind = "range", signal = { name = "маркер y", unit = "m" }, min = -0.2, max = 0.2, source = { kind = "estimate", reference = "Насадка остаётся над столом перед рукой." } }, { kind = "range", signal = { name = "маркер z", unit = "m" }, min = 0.0, max = 0.3, source = { kind = "estimate", reference = "Насадка не падает со стола и не улетает." } }]

