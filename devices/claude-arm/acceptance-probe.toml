version = 1
control = "control-probe.toml"
profile = "profile-probe.toml"

[[modes]]
id = "щуп"
horizon_ns = 10500000000
before_ns = 100000000
after_ns = 300000000
max_gap_ns = 2000000
source = { kind = "derived", reference = "Взять щуп из держателя, коснуться двух точек стола, поставить на место." }
# Лёгкий толчок по плечу после отхода: проверка, что рука держит позу.
excitation = "толчок"
stimuli = [
  { id = "толчок", signal = { name = "рука/толчок-плеча", unit = "N*m" }, at_ns = 10100000000, value = 0.1, comparison_value = 0.0, source = { kind = "estimate", reference = "Касание рукой человека." } },
]

[[criteria]]
case = { path = "поворот", mode = "щуп" }
limits = [{ kind = "range", signal = { name = "угол поворот", unit = "rad" }, min = -2.6179938779914944, max = 2.6179938779914944, source = { kind = "estimate", reference = "Рабочий диапазон сустава по эскизу." } }, { kind = "range", signal = { name = "щуп кончик z", unit = "m" }, min = 0.001, max = 0.3, source = { kind = "estimate", reference = "Наконечник не входит в стол глубже 2 мм и не улетает." } }, { kind = "range", signal = { name = "щуп x", unit = "m" }, min = 0.0, max = 0.4, source = { kind = "estimate", reference = "Насадка остаётся над столом перед рукой." } }, { kind = "range", signal = { name = "щуп y", unit = "m" }, min = -0.2, max = 0.2, source = { kind = "estimate", reference = "Насадка остаётся над столом перед рукой." } }, { kind = "range", signal = { name = "щуп z", unit = "m" }, min = 0.0, max = 0.3, source = { kind = "estimate", reference = "Насадка не падает со стола и не улетает." } }, { kind = "range", signal = { name = "маркер кончик z", unit = "m" }, min = -0.0005, max = 0.3, source = { kind = "estimate", reference = "Наконечник не входит в стол глубже 2 мм и не улетает." } }, { kind = "range", signal = { name = "маркер x", unit = "m" }, min = 0.0, max = 0.4, source = { kind = "estimate", reference = "Насадка остаётся над столом перед рукой." } }, { kind = "range", signal = { name = "маркер y", unit = "m" }, min = -0.2, max = 0.2, source = { kind = "estimate", reference = "Насадка остаётся над столом перед рукой." } }, { kind = "range", signal = { name = "маркер z", unit = "m" }, min = 0.0, max = 0.3, source = { kind = "estimate", reference = "Насадка не падает со стола и не улетает." } }]

