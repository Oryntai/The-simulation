# Физика режима «маркер»: сменщик насадок с замком от контроллера. Пишет tools/make_tools.py.
window_ns = [0, 12000000000]
source = "Полный горизонт режима «маркер»."

[models."сменщик"]
kind = "coupler"
carrier = { body = "рука/кисть", local_m = [0.0, 0.0, 0.03] }
# Идеальный замок: стык замыкается мгновенно, если насадка в держателе под фланцем.
source = "Эскиз замка: допуски совпадения 2 мм и 2° по фаскам, скорость и вращение из срабатывания защёлки за 50 мс. Механика защёлки и податливость стыка не замерены."
bounds = [0.002, 0.035, 0.02, 0.35]
lock = { signal = "рука/замок", max_age_ns = 20000000 }

[models."сменщик".stations]
"щуп" = { tool = { body = "щуп/основание", local_m = [0.0, 0.0, 0.0] }, parking_m = [0.16, -0.08, 0.075] }
"маркер" = { tool = { body = "маркер/основание", local_m = [0.0, 0.0, 0.0] }, parking_m = [0.16, 0.08, 0.075] }

# Свидетель режима: маркер поднят из держателя.
[[criteria]]
name = "маркер/подъём"
unit = "m"
series = { position = 14 }
statistic = "maximum"
tolerance = { value = 0.001, source = { estimate = "Проектный допуск численного опыта." } }
remainder = [{ value = 0.0, source = { estimate = "Остаток за пределами двух наблюдаемых разностей не оценён." } }, { value = 0.0, source = { estimate = "Остаток проверки решателя не оценён." } }, { value = 0.0, source = { estimate = "Разброс материалов требует стенда." } }]
lower = { value = 0.13, source = { estimate = "Насадка поднята на высоту переездов." } }
