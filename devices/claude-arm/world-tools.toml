name = "Рука Claude со сменщиком насадок"
seed = 8
# Как в world.toml: сверка привода на шаге толчка требует 240 кГц (DEFECTS.md, Д5).
physics_hz = 240000
gravity_m_s2 = [0.0, 0.0, -9.80665]

