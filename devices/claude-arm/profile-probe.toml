[paths."поворот"]
observation = { name = "рука/энкодер-поворота/value", unit = "rad" }
physical_response = [{ name = "угол поворот", unit = "rad" }]
command_delta = 0.01
max_observation_age_ns = 20000000
source = { kind = "derived", reference = "0.01 рад больше шага энкодера 0.0015 рад." }
hops = [
  { target = "transport:компьютер/request", direction = "input", delay_ns = 2000000, jitter_ns = 500000, receiver_tick_ns = 1000000, source = { kind = "derived", reference = "control-probe.toml, такт получателя 1 кГц" } },
  { target = "transport:компьютер/response", direction = "output", delay_ns = 1000000, jitter_ns = 500000, receiver_tick_ns = 10000000, source = { kind = "derived", reference = "control-probe.toml, такт получателя 100 Гц" } },
]

