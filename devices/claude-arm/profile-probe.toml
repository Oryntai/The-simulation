[[readouts]]
signal = { name = "маркер z", unit = "m" }
rate_hz = 1000
source = { kind = "derived", reference = "Точка крепления насадки из позы тела MuJoCo." }
formula = { kind = "body_point", body = "маркер/основание", local_m = [0.0, 0.0, 0.0], axis = 2 }

[[readouts]]
signal = { name = "маркер кончик x", unit = "m" }
rate_hz = 1000
source = { kind = "derived", reference = "Центр наконечника из позы тела MuJoCo." }
formula = { kind = "body_point", body = "маркер/основание", local_m = [0.0, 0.0, 0.055], axis = 0 }

