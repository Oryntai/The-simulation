version = 1
required_modes = ["щуп"]
# Координаты и скорости MuJoCo в журнал раз в 1 мс, а не на каждом из 240 000 шагов в секунду (DEFECTS.md, Д8).
joint_state_hz = 1000

# Сменщик насадок и его замок живут в физике режима: процесс читает команду замка с шины.
# Журнал процессов раз в 1 мс: на 240 кГц сплошной журнал шагов не помещается в память (DEFECTS.md, Д8).
[mode_physics]
"щуп" = { case = "case-probe.toml", witness = "щуп/подъём", journal_hz = 1000 }

[[readouts]]
signal = { name = "угол поворот", unit = "rad" }
rate_hz = 1000
source = { kind = "derived", reference = "Истинная координата сустава из MuJoCo." }
formula = { kind = "position", index = 0 }

[[readouts]]
signal = { name = "угол плечо", unit = "rad" }
rate_hz = 1000
source = { kind = "derived", reference = "Истинная координата сустава из MuJoCo." }
formula = { kind = "position", index = 1 }

[[readouts]]
signal = { name = "угол локоть", unit = "rad" }
rate_hz = 1000
source = { kind = "derived", reference = "Истинная координата сустава из MuJoCo." }
formula = { kind = "position", index = 2 }

[[readouts]]
signal = { name = "угол запястье", unit = "rad" }
rate_hz = 1000
source = { kind = "derived", reference = "Истинная координата сустава из MuJoCo." }
formula = { kind = "position", index = 3 }

[[readouts]]
signal = { name = "угол вращение", unit = "rad" }
rate_hz = 1000
source = { kind = "derived", reference = "Истинная координата сустава из MuJoCo." }
formula = { kind = "position", index = 4 }

[[readouts]]
signal = { name = "щуп x", unit = "m" }
rate_hz = 1000
source = { kind = "derived", reference = "Точка крепления насадки из позы тела MuJoCo." }
formula = { kind = "body_point", body = "щуп/основание", local_m = [0.0, 0.0, 0.0], axis = 0 }

[[readouts]]
signal = { name = "щуп y", unit = "m" }
rate_hz = 1000
source = { kind = "derived", reference = "Точка крепления насадки из позы тела MuJoCo." }
formula = { kind = "body_point", body = "щуп/основание", local_m = [0.0, 0.0, 0.0], axis = 1 }

[[readouts]]
signal = { name = "щуп z", unit = "m" }
rate_hz = 1000
source = { kind = "derived", reference = "Точка крепления насадки из позы тела MuJoCo." }
formula = { kind = "body_point", body = "щуп/основание", local_m = [0.0, 0.0, 0.0], axis = 2 }

[[readouts]]
signal = { name = "щуп кончик x", unit = "m" }
rate_hz = 1000
source = { kind = "derived", reference = "Центр наконечника из позы тела MuJoCo." }
formula = { kind = "body_point", body = "щуп/основание", local_m = [0.0, 0.0, 0.045], axis = 0 }

[[readouts]]
signal = { name = "щуп кончик y", unit = "m" }
rate_hz = 1000
source = { kind = "derived", reference = "Центр наконечника из позы тела MuJoCo." }
formula = { kind = "body_point", body = "щуп/основание", local_m = [0.0, 0.0, 0.045], axis = 1 }

[[readouts]]
signal = { name = "щуп кончик z", unit = "m" }
rate_hz = 1000
source = { kind = "derived", reference = "Центр наконечника из позы тела MuJoCo." }
formula = { kind = "body_point", body = "щуп/основание", local_m = [0.0, 0.0, 0.045], axis = 2 }

[[readouts]]
signal = { name = "маркер x", unit = "m" }
rate_hz = 1000
source = { kind = "derived", reference = "Точка крепления насадки из позы тела MuJoCo." }
formula = { kind = "body_point", body = "маркер/основание", local_m = [0.0, 0.0, 0.0], axis = 0 }

[[readouts]]
signal = { name = "маркер y", unit = "m" }
rate_hz = 1000
source = { kind = "derived", reference = "Точка крепления насадки из позы тела MuJoCo." }
