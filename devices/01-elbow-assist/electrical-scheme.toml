current_limit_a = { measurement = "Подтвердить ток по проводу, контакту и длительности с контролем нагрева." }
after = ["lead_hall_2_start"]

[connections.lead_hall_3_start]
kind = "solder"
ends = ["bridge/hall_3", "lead_hall_3/a"]
resistance_ohm = { measurement = "Четырёхпроводно измерить сопротивление участка и стыка без питания." }
current_limit_a = { measurement = "Подтвердить ток по проводу, контакту и длительности с контролем нагрева." }
after = ["lead_hall_return_finish"]

[connections.lead_hall_3_finish]
kind = "solder"
ends = ["lead_hall_3/b", "motor/hall_3"]
resistance_ohm = { measurement = "Четырёхпроводно измерить сопротивление участка и стыка без питания." }
current_limit_a = { measurement = "Подтвердить ток по проводу, контакту и длительности с контролем нагрева." }
after = ["lead_hall_3_start"]

[rails."вход батареи"]
ends = ["bank/p", "bank/g"]
reverse_limit_v = { measurement = "Подтвердить обратное напряжение и предел защиты экземпляра." }

[rails."питание моста"]
ends = ["bridge/p", "bridge/g"]
reverse_limit_v = { measurement = "Подтвердить обратное напряжение и предел защиты экземпляра." }

[rails.vdd]
ends = ["board/p", "board/g"]
reverse_limit_v = { measurement = "Подтвердить обратное напряжение и предел защиты экземпляра." }

