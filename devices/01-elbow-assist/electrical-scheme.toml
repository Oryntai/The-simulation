format = 1
scope = "assembly"
name = "Монтажная схема 6S2P, силовой привод и измерители"
nets = ["adcangle", "adcbattery", "adccurrent", "adctemp", "bank_plus", "bus", "dir", "enable", "g", "hall_supply", "hall_1", "hall_2", "hall_3", "protected", "pwm", "u", "v", "vdd", "w"]

[components.bank]
part = "lg_m50_6s2p"
nets = { p = "bank_plus", g = "g" }

[components.bms]
part = "bms_series_unspecified"
nets = { input = "bank_plus", output = "protected", g = "g" }

[components.fuse]
part = "fuse_series"
nets = { input = "protected", output = "bus" }

[components.terminal]
part = "harness_terminal"
nets = { clamp = "bus", tail = "bus" }

[components.regulator]
part = "logic_buck_24"
nets = { input = "bus", output = "vdd", g = "g" }

[components.board]
part = "virtual_controller_io"
nets = { p = "vdd", g = "g", pwm = "pwm", dir = "dir", enable = "enable", adcangle = "adcangle", adccurrent = "adccurrent", adctemp = "adctemp", adcbattery = "adcbattery" }

[components.bridge]
part = "bldc_bridge_unspecified"
nets = { p = "bus", g = "g", pwm = "pwm", dir = "dir", enable = "enable", u = "u", v = "v", w = "w", hall_supply = "hall_supply", hall_1 = "hall_1", hall_2 = "hall_2", hall_3 = "hall_3" }

[components.motor]
part = "maxon_500267"
nets = { u = "u", v = "v", w = "w", hall_supply = "hall_supply", hall_1 = "hall_1", hall_2 = "hall_2", hall_3 = "hall_3", hall_return = "g" }

[components.feedback]
part = "analogue_feedback_unspecified"
nets = { p = "vdd", g = "g", angle = "adcangle", current = "adccurrent", temp = "adctemp", battery = "adcbattery", bus = "bus" }

[components.return_bus]
part = "harness_copper"
nets = { a = "g", b = "g" }

[components.protected_feed]
part = "harness_copper"
nets = { a = "protected", b = "protected" }

[components.fuse_output]
part = "harness_copper"
nets = { a = "bus", b = "bus" }

[components.bridge_feed]
part = "harness_copper"
nets = { a = "bus", b = "bus" }

[components.logic_power]
part = "harness_copper"
nets = { a = "vdd", b = "vdd" }

[components.control_pwm]
part = "harness_copper"
nets = { a = "pwm", b = "pwm" }

[components.control_dir]
part = "harness_copper"
nets = { a = "dir", b = "dir" }

[components.control_enable]
part = "harness_copper"
nets = { a = "enable", b = "enable" }

[components.phase_u]
part = "harness_copper"
nets = { a = "u", b = "u" }

[components.phase_v]
part = "harness_copper"
nets = { a = "v", b = "v" }

[components.phase_w]
part = "harness_copper"
nets = { a = "w", b = "w" }

[components.sense_angle]
part = "harness_copper"
