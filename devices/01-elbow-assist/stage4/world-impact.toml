# Контрольное устройство 1 из docs/PLATFORM_SPEC.md: механика в воздухе.
# Шаг 25 мкс и гравитация совпадают с эталонным контуром golden/exo_loop.
format = 3
name = "Контрольное устройство 1"
seed = 1
physics_hz = 40000
gravity_m_s2 = [0.0, 0.0, -9.80665]

[environment]
density_kg_m3 = 0.0
viscosity_pa_s = 0.0
wind_m_s = [0.0, 0.0, 0.0]

[[devices]]
name = "устройство"
file = "impact-device.toml"

[[environment.collision]]
# Плоский упор перпендикулярен касательной при 45 градусах. Радиус пятна 10 мм
# и полутолщина упора 5 мм добавлены к радиус-вектору точки на плече 150 мм.
shape = { kind = "box", size_m = [0.010, 0.040, 0.060] }
pose = { position_m = [-0.11667261889578032, 0.0, 0.9045405845398161], rpy_deg = [0.0, 45.0, 0.0] }
contact_mask = [2, 1]
