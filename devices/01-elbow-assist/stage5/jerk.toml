[motion.maneuver]
at_ns = 15000000
initiator = "резкое возмущение испытания"
[motion.maneuver.offsets.j0053]
knots = [[0,0.0], [6000000,0.23]]
source = { estimate = "Синтетический неожиданно быстрый манёвр." }

[[checks]]
id = "опора"
bounds = [0.5, 60.0]
source = "Преднатяг 2 мм × 2500 Н/м = 5 Н, номинальное окно стенда."
min_samples = 5


metric = { "kind" = "normal", "patch" = "опора" }

[[checks]]
id = "рычаг"
bounds = [0.5, 90.0]
source = "Преднатяг 2 мм × 2500 Н/м = 5 Н, плюс изменяющаяся реакция."
min_samples = 5


metric = { "kind" = "normal", "patch" = "рычаг" }

[[checks]]
id = "сила по закону"
bounds = [0.0, 1e-10]
source = "Независимая интерполяция узлов F(x) без гашения."
min_samples = 5


metric = { "kind" = "pad_law_residual", "patch" = "рычаг" }

[[checks]]
id = "баланс сил"
bounds = [0.0, 1e-10]
source = "Третий закон Ньютона, в одной мировой системе."
min_samples = 5


metric = { "kind" = "action_reaction_residual", "interface" = "рычаг" }

[[checks]]
id = "движение"
bounds = [0.002, 0.15]
source = "Опорная траектория 0.04 рад за 80 мс с ограниченным приводом."
min_samples = 5


metric = { "kind" = "axis", "channel" = "участник/намерение", "statistic" = "span", "quantity" = "position" }

[[checks]]
id = "момент"
bounds = [0.01, 242.0]
source = "Ненулевой выход под ELF, предел 242 Н·м из sampled-drive.toml."
min_samples = 5


metric = { "kind" = "signal", "name" = "устройство/мотор/joint_torque_nm", "unit" = "N*m", "statistic" = "peak" }

[[checks]]
id = "ток"
bounds = [0.001, 15.001]
source = "Ограничение 15 А из sampled-drive.toml; допуск разрешения 1 мА."
min_samples = 5


metric = { "kind" = "signal", "name" = "устройство/мотор/current_a", "unit" = "A", "statistic" = "peak" }

[[checks]]
id = "рывок"
bounds = [0.0, 3000.0]
source = "Проектный бюджет 3 мрад за 10 мс в масштабе q/t³, сравнение на сетке 0,5 мс."
min_samples = 5

required_design = true
metric = { "kind" = "jerk", "channel" = "участник/намерение", "sample_ns" = 500000 }
