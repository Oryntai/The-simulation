# Смещение по X 2 мм и по Y 6 мм моделирует несоосность.
[placement_overrides."устройство"]
position_m = [-0.034952018980146465, -0.15364711061192898, 1.1144383568668659]
[motion.axes.j0053.effort_limit]
value = 8
source = { estimate = "Слабый синтетический профиль, входная чувствительность." }
[motion.response]
enabled = true
initiator = "реакция на сжатие"
patch = "рычаг"
# Триггер численной постановки ниже расчётного преднатяга 5 Н.
threshold_n = { value = 1.0, source = { estimate = "Испытательное условие, не порог отдёргивания человека." } }
latency_ns = 3000000
latency_source = { estimate = "Синтетическая задержка 3 мс для потактовой сверки." }

[motion.response.offsets.j0053]
knots = [[0, 0.0], [15000000, 0.015]]
source = { estimate = "Малый отвод от площадки, амплитуда и время заданы для стенда." }
[[checks]]
id = "опора"
bounds = [0.5, 60.0]
source = "Преднатяг 2 мм × 2500 Н/м = 5 Н, номинальное окно стенда."
min_samples = 5


metric = { "kind" = "normal", "patch" = "опора" }

[[checks]]
id = "рычаг"
bounds = [0.5, 90.0]
source = "Преднатяг 2 мм × 2500 Н/м = 5 Н, плюс изменяющаяся реакция."
min_samples = 5


metric = { "kind" = "normal", "patch" = "рычаг" }

[[checks]]
id = "сила по закону"
bounds = [0.0, 1e-10]
source = "Независимая интерполяция узлов F(x) без гашения."
min_samples = 5


metric = { "kind" = "pad_law_residual", "patch" = "рычаг" }

[[checks]]
id = "баланс сил"
bounds = [0.0, 1e-10]
source = "Третий закон Ньютона, в одной мировой системе."
min_samples = 5


metric = { "kind" = "action_reaction_residual", "interface" = "рычаг" }

[[checks]]
id = "движение"
bounds = [0.002, 0.15]
source = "Опорная траектория 0.04 рад за 80 мс с ограниченным приводом."
min_samples = 5


metric = { "kind" = "axis", "channel" = "участник/намерение", "statistic" = "span", "quantity" = "position" }

[[checks]]
id = "момент"
bounds = [0.01, 242.0]
source = "Ненулевой выход под ELF, предел 242 Н·м из sampled-drive.toml."
min_samples = 5


metric = { "kind" = "signal", "name" = "устройство/мотор/joint_torque_nm", "unit" = "N*m", "statistic" = "peak" }

[[checks]]
id = "ток"
bounds = [0.001, 15.001]
source = "Ограничение 15 А из sampled-drive.toml; допуск разрешения 1 мА."
min_samples = 5


metric = { "kind" = "signal", "name" = "устройство/мотор/current_a", "unit" = "A", "statistic" = "peak" }

[[checks]]
id = "реакция на прижим"
bounds = [1.0, 1.0]
source = "Ровно одно срабатывание после измеренного прижима, задержка 3 мс в синтетическом профиле."
min_samples = 1
metric = { kind = "motion_events" }
