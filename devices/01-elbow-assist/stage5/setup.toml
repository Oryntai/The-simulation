assignments = {}
pairs = []

# Параметры численного опыта Euler/Newton: эталонный профиль MuJoCo 4.0.1.
[contacts.solver]
method = "newton"
elliptic = true
impratio = 1.0
tolerance = 1e-8
iterations = 100
line_search_tolerance = 0.01
line_search_iterations = 50
noslip_tolerance = 1e-6
noslip_iterations = 0
ccd_tolerance = 1e-6
ccd_iterations = 35

[control]
