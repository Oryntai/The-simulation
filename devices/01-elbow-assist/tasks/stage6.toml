version = 1
control = "../stage6-control.toml"
profile = "stage6-profile.toml"

[fault_sweep]
at_ns = 1000000000
packet_delay_ns = 60000000
# Диапазоны тока и механического хода сохраняются при отказе.
invariant_limits = true
source = { kind = "derived", reference = "Момент штатных сценариев отказа 1 с. 60 мс — максимальный интервал соседних доставок команд в расписании build-inputs.py." }

[[modes]]
id = "assist"
horizon_ns = 3000000000
before_ns = 50000000
after_ns = 100000000
max_gap_ns = 25000
source = { kind = "derived", reference = "Три секунды физики на сетке 25 мкс по сохранённому эталону." }
excitation = "контрольная метка"
stimuli = [
  { id = "контрольная метка", signal = { name = "устройство/проверочное_усилие", unit = "N*m" }, at_ns = 1000000000, value = 0, comparison_value = 0.5, source = { kind = "derived", reference = "Для сверки на траекторию действует только штатное усилие. 0.5 Н·м предусмотрено для независимого возбуждения на будущем стенде." } },
]

[[criteria]]
case = { path = "драйвер", mode = "assist" }
limits = [
  { kind = "range", signal = { name = "qpos[0]", unit = "rad" }, min = 0, max = 2.2, source = { kind = "derived", reference = "Границы хода MS-Human-700. Мягкий упор может дать выход." } },
  { kind = "range", signal = { name = "устройство/мотор/current_a", unit = "A" }, min = -12.18, max = 12.18, source = { kind = "derived", reference = "Порог прошивки 3×4.06 А из её блока настроек." } },
]
response = { signal = { name = "устройство/мотор/current_a", unit = "A" }, min_change = 0.01, within_ns = 100000000, source = { kind = "derived", reference = "0.01 А различима по штатной шкале ADC 0.1 В/А." } }

