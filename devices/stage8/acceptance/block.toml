# Синтетический однородный блок массой 1 кг. Размеры оснастки заданы ниже.
format = 3
name = "Короткий блок"
[[links]]
name = "блок"
[links.joint]
kind = "slide"
axis = [1.0, 0.0, 0.0]
damping = 0.0
friction_loss = 0.0
armature = 0.0
efforts = [{ name = "сила", dof = 0 }]
[links.mass]
kind = "explicit"
mass_kg = 1.0
com_m = [0.0, 0.0, 0.0]
# I = m(b² + h²)/12 и циклические перестановки для однородного блока.
inertia_kg_m2 = [0.0016666666666666668, 0.004166666666666667, 0.004166666666666667, 0.0, 0.0, 0.0]
provenance = { datasheet = "Синтетический однородный блок 200×100×100 мм, 1 кг." }

[[links.collision]]
shape = { kind = "box", size_m = [0.2, 0.1, 0.1] }
contact_mask = [0, 0] # Контакт исключён постановкой.
friction = [0.0, 0.0, 0.0]
