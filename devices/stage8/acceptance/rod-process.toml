source = "Стержень массы 1 кг, ускорение 10 м/с² в rod-world.toml. Координата определяется суммой скоростей полунеявного Euler."
window_ns = [0, 50000000]

[models."датчик хода"]
kind = "coordinate"
joint = "направляющая/ход"

[[criteria]]
name = "максимальный ход"
unit = "m"
series = { measurement = "датчик хода/position" }
statistic = "maximum"
tolerance = { value = 0.00025, source = { derived = "Разность Euler на соседних сетках a·t·Δt/4 не больше 125 мкм за 50 мс. Двоичный запас для синтетического сравнения." } }
upper = { value = 0.02, source = { derived = "Зазор 20 мм выбран в синтетической постановке. Аналитический ход за 50 мс составляет 12,5 мм." } }
remainder = [
 { value = 0.00025, source = { derived = "Модуль ошибки Euler a·t·Δt/2 не больше 250 мкм на базовой сетке." } },
 { value = 0, source = { derived = "Одна бесконтактная ось. Системы контактных ограничений нет." } },
 { value = 0, source = { derived = "Масса и гравитация заданы точно для условной постановки." } },
]
