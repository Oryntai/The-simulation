# Сетка 1 мс и ускорение 10 м/с² дают целочисленное число шагов и ручную сверку.
format = 3
name = "Стержень на направляющей"
seed = 2 # Отдельная метка синтетического входа.
physics_hz = 1000
gravity_m_s2 = [10, 0, 0]

[environment]
# В независимом решении аэродинамики нет.
density_kg_m3 = 0
viscosity_pa_s = 0
wind_m_s = [0, 0, 0]

[[devices]]
name = "направляющая"
file = "rod.toml"
# Начальная высота 1 м отделяет исходную позу от начала координат.
pose = { position_m = [0, 0, 1] }
