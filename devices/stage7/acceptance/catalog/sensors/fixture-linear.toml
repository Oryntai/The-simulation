bias = { value = 0, provenance = "estimate", source = "Идеальный отсчёт без смещения." }
drift_per_s = { value = 0, provenance = "estimate", source = "Идеальный отсчёт без дрейфа." }
drift_rw_std = { value = 0, provenance = "estimate", source = "Идеальный отсчёт без случайного дрейфа." }
quantum = { value = 0, provenance = "estimate", source = "Квантование отключено." }
drop_probability = { value = 0, provenance = "estimate", source = "Доставка без пропусков." }
