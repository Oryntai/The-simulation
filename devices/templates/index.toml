# `default` задаёт стартовый шаблон. `order` идёт первым, остальные файлы сортируются по id.
# Оба поля необязательны, каждое записывается в одну строку.
# Идентификатор — имя файла без `.device`, из букв, цифр, дефисов и подчёркиваний.
# Заголовок берётся из поля `name` в самом шаблоне.
# Файлы выгружены из прежних шаблонов конструктора через `sim_device::file::to_text`.
# Размеры, нагрузки, углы и электрические режимы унаследованы как проектные оценки.
# Параметры BMS вычислены прежним шаблоном через `sim_battery::BmsSpec::bq769x0`.
# Поля подтверждающих источников не заполнялись при переносе.
default = "elbow-24v"
order = ["elbow", "shoulder-elbow", "knee", "full", "third-arm", "glasses", "elbow-24v"]
