format = 3
name = "Одноосный подвес RGB-камеры"
schematic = "electrical-scheme.toml"

[[links]]
name = "головка"

[links.joint]
name = "ось"
kind = "hinge"
axis = [0.0, 1.0, 0.0]
# Механический сектор стенда по эскизу. Потери подшипника в опыте не выделяются.
limits_deg = [-45.0, 45.0]
armature = 0.0
damping = 0.0
friction_loss = 0.0
efforts = [{ name = "скважность", dof = 0 }]

[links.mass]
kind = "explicit"
mass_kg = 0.12
com_m = [0.0, 0.0, -0.025]
# Брусок 55 × 55 × 40 мм, I = m(a²+b²)/12. Вокруг оси с переносом
# Iy + 0.12·0.025² = 0.00012125 кг·м².
inertia_kg_m2 = [0.00004625, 0.00004625, 0.0000605, 0.0, 0.0, 0.0]
provenance = { estimate = "Предварительная масса и центр головки по компоновке. Нужен замер." }

[[links.visual]]
# Тот же корпус, передняя грань за оптическим центром на 5 мм.
shape = { kind = "box", size_m = [0.055, 0.055, 0.040] }
pose = { position_m = [0.0, 0.0, -0.025] }

[[drives]]
name = "мотор"
part = "n20-100-6v-hp"
effort = "скважность"

[drives.params]
# Паспорт Pololu #2214 (catalog/drives/n20-100-6v-hp.toml): U=6 В, R=3.75 Ом,
# ω0=310 об/мин, I0=0.10 A, Istall=1.60 A, Tstall=0.16671305 Н·м, N=100.37.
# Предел стенда равен экстраполированному Istall, аппаратная защита неизвестна.
current_limit_a = 1.6
# Аналог maxon DCX 6 M, обмотка 4.5 В: L=R·0.0711 мГн/20.8 Ом, Jрот=0.0179 г·см².
# https://www.maxongroup.com/medias/sys_master/root/8881015652382/EN-21-085.pdf
inductance_h = 1.2818509615384614e-5
rotor_inertia_kg_m2 = 1.79e-9
gear_input_inertia_kg_m2 = 0.0 # Неизвестная инерция ступеней опущена.
# k=(U−R·I0)/(N·ω0). η=Tstall/(Istall·k·N), обратный КПД принят равным прямому.
motor_constant = 0.0017263477807439786
gear_efficiency = 0.6013362698986661
backward_efficiency = 0.6013362698986661
# B=k·I0/(N·ω0). Сухое трение в этом опыте отключено. Остальные масштабы Nω0
# при этом не влияют на результат.
viscous_nm_per_rad_s = 5.2982696179193964e-8
coulomb_nm = 0.0
static_friction_nm = 0.0
stribeck_rad_s = 3258.323764621678
friction_band_rad_s = 3258.323764621678
# Те же гипотезы стенда, что в 04: полный зазор 0.5°, прогиб 0.5° при stall.
# K=Tstall/(π/360), c=2ζ√(K·Jприв), ζ=1/√2. Jприв — приведённая
# инерция относительной моды с учётом переноса оси головки.
backlash = 0.008726646259971648
coupling_stiffness = 19.103908309506938
coupling_damping = 0.019501366239650077
# Идеальный мост принимает CSV на сетке физики без задержки шины.
control_hz = 250000.0
bus_delay_s = 0.0

[[sensors]]
name = "кадр"
part = "reference-rgb"
link = "головка"
# Начало оптического кадра совпадает с осью вращения, +Z вперёд.

[[sensors]]
name = "угол"
part = "as5600"
link = "головка"
joint = "ось"

[sensors.params]
# Опрос стенда 500 Гц, доставка на один период позже. Сквозной режим
# без переноса по обороту для рабочего сектора ±45°. Начальный ноль по эскизу.
rate_hz = 500.0
latency_s = 0.002
encoder_mode = 0.0
encoder_zero = 0.0
# Разрешение AS5600 из каталога, 2π / 4096 рад.
quantum = 0.0015339807878856412
# Синтетическая калибровка. Шум, монтажный перекос и дрейф требуют замеров.
bias = 0.0
noise_std = 0.0
drift_per_s = 0.0
drift_rw_std = 0.0
drop_probability = 0.0
fault = 0.0
saturation = 0.0
