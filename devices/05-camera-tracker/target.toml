format = 3
name = "Каретка с оптической мишенью"

[[links]]
name = "мишень"

[links.joint]
name = "ось"
kind = "slide"
axis = [1.0, 0.0, 0.0]
# Стенд перемещает карточку известной силой. Идеальная направляющая.
armature = 0.0
damping = 0.0
friction_loss = 0.0
efforts = [{ name = "сила", dof = 0 }]

[links.mass]
kind = "explicit"
# Условная масса нагруженной каретки для аналитической сверки a=F/m.
mass_kg = 0.02
com_m = [0.0, 0.0, 0.0]
# Брусок 240 × 180 × 1 мм, I = m(a²+b²)/12. В стенде вращение запрещено.
inertia_kg_m2 = [0.00005400166666666667, 0.00009600166666666667, 0.00015, 0.0, 0.0, 0.0]
provenance = { estimate = "Масса по эскизу, калибровка по известному ускорению стенда." }

[[links.visual]]
# Красная матовая карточка 24 × 18 см, толщиной 1 мм, по эскизу мишени.
shape = { kind = "box", size_m = [0.24, 0.18, 0.001] }
rgba = [1.0, 0.0, 0.0, 1.0]
