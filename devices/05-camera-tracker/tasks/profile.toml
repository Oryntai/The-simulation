version = 1
required_modes = ["слежение", "разомкнутый"]
mode_control = { "разомкнутый" = "open.toml" }

[[readouts]]
signal = { name = "ошибка линии визирования", unit = "rad" }
rate_hz = 1000
source = { kind = "derived", reference = "atan2(x+0.24,1.20) минус угол подвеса; геометрия world.toml" }
formula = { kind = "bearing_error", target_index = 1, offset_m = 0.24, distance_m = 1.20, axis_index = 0 }

[paths."привод"]
observation = { name = "подвес/кадр/image", unit = "RGB8" }
physical_response = [{ name = "ошибка линии визирования", unit = "rad" }]
command_delta = 0.001
max_observation_age_ns = 180000000
source = { kind = "derived", reference = "Стендовый порог команды меньше одного пикселя: 0.65/90 = 0.0072. Дедлайн control.toml." }
hops = [
  { target = "transport:зрение/request", direction = "input", delay_ns = 4000000, jitter_ns = 1000000, receiver_tick_ns = 1000000, source = { kind = "derived", reference = "control.toml, такт получателя 1 кГц" } },
  { target = "transport:зрение/response", direction = "output", delay_ns = 3000000, jitter_ns = 1000000, receiver_tick_ns = 10000000, source = { kind = "derived", reference = "control.toml, такт получателя 100 Гц" } },
]
