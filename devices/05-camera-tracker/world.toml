format = 3
name = "Камера на оси и подвижная мишень"
# Фиксированное зерно стенда.
seed = 5
# Порог sim-drive для инерций оси и передачи ≈ 214 кГц. 250 кГц
# выше порога и делится на частоты кадров и углового датчика.
physics_hz = 250000
# Нормальное ускорение по СИ. +Y вниз, как в кадре камеры.
gravity_m_s2 = [0.0, 9.80665, 0.0]

[environment]
# Силы воздуха в стенде отключены.
density_kg_m3 = 0.0
viscosity_pa_s = 0.0
wind_m_s = [0.0, 0.0, 0.0]

[[devices]]
name = "подвес"
file = "device.toml"

[[devices]]
name = "каретка"
file = "target.toml"
# Координаты центра — из эскиза оптического стенда, 24 см вправо на 1.2 м.
# При конечном угле порядка 35° это оставляет проекцию карточки в кадре.
pose = { position_m = [0.24, 0.0, 1.20] }
