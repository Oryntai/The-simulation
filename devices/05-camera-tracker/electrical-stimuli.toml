# Добавляется к control.toml, в котором внешнее зрение владеет только скважностью.
# Питание AS5600 и разрешение привода разведены по времени. Логическое
# разрешение не коммутирует внешнюю шину и не удостоверяет состояние EN на плате.
[[stimulus]]
at_ns = 0
target = "подвес/скважность-power"
unit = "bool"
value = 0
source = "Закрытое начальное состояние по резерву stage6-control.toml. Цель опыта — проверить ток при наличии шины и снятом разрешении."

[[stimulus]]
at_ns = 20000000
target = "подвес/скважность-power"
unit = "bool"
value = 1
source = "Включение через половину периода кадра 40 мс по reference-rgb. Штатное разрешение 1 из stage6-power.toml."

[[stimulus]]
at_ns = 80000000
target = "подвес/скважность-power"
unit = "bool"
value = 0
source = "Отсечка на границе второго периода RGB, после восстановления независимой шины AS5600. Ноль — резерв stage6-control.toml."

[[stimulus]]
at_ns = 100000000
target = "подвес/скважность-power"
unit = "bool"
value = 1
source = "Возврат разрешения через половину периода RGB. До конца опыта остаётся такое же окно 20 мс для наблюдения тока."
