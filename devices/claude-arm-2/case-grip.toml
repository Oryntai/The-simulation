# Физика режима «хват»: вода в бутылке и кружке. Пишет tools/make_task.py.
window_ns = [0, 24000000000]
source = "Полный горизонт режима «налив»."

[models."вода"]
kind = "liquid"
gravity_m_s2 = [0.0, 0.0, -9.80665]
source = "Квазистатическая жидкость (crates/sim-cli/src/tasks/processes/models/liquid.rs): плоская поверхность по эффективной тяжести, Торричелли через срез горла, баллистическая струя, эффект чайника. Волны, брызги, капли на стенках и инерция перетекающей воды не посчитаны."

[models."вода".fluid]
density_kg_m3 = { value = 998.2, source = { datasheet = "Вода при 20 °C, справочная плотность." } }
discharge = { value = 0.6, source = { estimate = "Коэффициент расхода острой кромки около 0.6–0.62; кромка горла ПЭТ не замерена." } }
detach_m_s = { value = 0.15, source = { estimate = "Порог отрыва струи от кромки (эффект чайника) — порядок величины, не замер на этом горле." } }
slosh_s = { value = 0.047, source = { estimate = "1/ω первой моды плеска в цилиндре R = 39.5 мм: ω² = 1.841·g/R." } }

[models."вода".vessels."бутылка"]
body = "\u0431\u0443\u0442\u044b\u043b\u043a\u0430/\u043a\u043e\u0440\u043f\u0443\u0441"
bottom_m = [0.0, 0.0, 0.001]
axis = [0.0, 0.0, 1.0]
profile_m = [[0.0, 0.0395], [0.194, 0.0395], [0.234, 0.01085], [0.269, 0.01085]]
initial_ml = 1000.0
rigid_initial = true
glug_ml_s = { value = 100.0, source = { estimate = "Перевёрнутая литровая бутылка опорожняется толчками около 10 с; не замер." } }

[models."вода".vessels."кружка"]
body = "\u043a\u0440\u0443\u0436\u043a\u0430/\u043a\u043e\u0440\u043f\u0443\u0441"
bottom_m = [0.0, 0.0, 0.006]
axis = [0.0, 0.0, 1.0]
profile_m = [[0.0, 0.037], [0.089, 0.037]]
initial_ml = 0.0

# Решатель контактов: noslip убирает численную ползучесть мягкого трения MuJoCo — бутылка
# под постоянным весом сползала в схвате на 5 мм/с при шестикратном запасе по трению.
[contacts]
table = "contact-materials.toml"

[contacts.solver]
method = "newton"
elliptic = true
impratio = 1.0
tolerance = 1e-8
iterations = 100
line_search_tolerance = 0.01
line_search_iterations = 50
noslip_tolerance = 1e-6
noslip_iterations = 20
ccd_tolerance = 1e-6
ccd_iterations = 50

[contacts.assignments]
