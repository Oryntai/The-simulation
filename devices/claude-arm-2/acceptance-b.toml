version = 1
control = "control.toml"
profile = "profile.toml"

[[modes]]
id = "налив"
horizon_ns = 52000000000
before_ns = 100000000
after_ns = 300000000
max_gap_ns = 2000000
source = { kind = "derived", reference = "Взять литровую бутылку воды, взвесить в руке, налить 200 мл в кружку, вернуть бутылку на место." }
# Толчок по плечу в конце: рука после работы держит позу.
excitation = "толчок"
stimuli = [{ id = "толчок", signal = { name = "рука/толчок-плеча", unit = "N*m" }, at_ns = 51600000000, value = 1.0, comparison_value = 0.0, source = { kind = "estimate", reference = "Касание рукой человека." } }]

[[criteria]]
case = { path = "поворот", mode = "налив" }
limits = [{ kind = "range", signal = { name = "угол поворот", unit = "rad" }, min = -2.9670597283903604, max = 2.9670597283903604, source = { kind = "estimate", reference = "Рабочий диапазон сустава по эскизу." } }, { kind = "range", signal = { name = "вода/мимо", unit = "ml" }, min = 0.0, max = 0.05, source = { kind = "estimate", reference = "Ни капли мимо: пролито меньше одной капли, 0.05 мл." } }, { kind = "range", signal = { name = "вода/кружка", unit = "ml" }, min = 0.0, max = 205.0, source = { kind = "estimate", reference = "Кружку не переливать: не больше 200 + 5 мл." } }, { kind = "forbidden", signal = { name = "вода/цель", unit = "1" }, source = { kind = "estimate", reference = "К концу прогона в кружке 200 ± 5 мл: процесс «вода» поднимает событие, если нет." } }, { kind = "range", signal = { name = "вода/поток", unit = "ml/s" }, min = 0.0, max = 1000.0, source = { kind = "estimate", reference = "Расход из бутылки — для отчёта; предел заведомо широкий." } }, { kind = "range", signal = { name = "горло z", unit = "m" }, min = -0.01, max = 1.0, source = { kind = "estimate", reference = "Высота среза горла — для отчёта; предел заведомо широкий." } }, { kind = "range", signal = { name = "бутылка z", unit = "m" }, min = -0.002, max = 0.5, source = { kind = "estimate", reference = "Бутылка не проваливается в стол и не улетает." } }, { kind = "range", signal = { name = "бутылка ось z", unit = "m" }, min = -1.0, max = 1.5, source = { kind = "estimate", reference = "Наклон бутылки — для отчёта: точка оси в 1 м над дном." } }, { kind = "range", signal = { name = "бутылка x", unit = "m" }, min = 0.0, max = 0.8, source = { kind = "estimate", reference = "Бутылка над столом; где она встала в конце — по последнему значению." } }, { kind = "range", signal = { name = "бутылка y", unit = "m" }, min = -0.5, max = 0.5, source = { kind = "estimate", reference = "Бутылка над столом; где она встала в конце — по последнему значению." } }, { kind = "range", signal = { name = "кружк