effort = "поворот"

[drives.params]
# Поворот: груз не поднимает, ток 4 А (32 Н·м) — для разгона.
# Ток защиты драйвера: момент на выходе k·N·η·I.
current_limit_a = 4.0
# k = K_t maxon 500267 (каталог, 231 мН·м/А): в СИ постоянная момента равна постоянной ЭДС.
motor_constant = 0.231
# Обратный КПД волновой передачи принят равным прямому 0.7 (оценка каталога).
backward_efficiency = 0.7
# B = k·I₀/ω₀ мотора: I₀ = 0.278 А, 1960 об/мин без нагрузки (maxon 500267). Сухое трение не выделено.
