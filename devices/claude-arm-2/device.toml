bus_delay_s = 0.0005
position_min = -2.967059728
position_max = 2.967059728
# Без мёртвой зоны: интеграл держит груз без подработки.
position_deadband = 0.0
position_gain = 20.0
speed_limit = 3.0
# Скоростной ПИ: полоса около 60 рад/с при Jрот·N² + Jнагр, момент на ток k·N·η = 8.1 Н·м/А.
speed_kp = 14.607
speed_ki = 219.1
# Тепловая сеть: R и τ из каталога; α меди, среда 25 °C, потери обмотки в обмотке, передачи — в корпусе (оценки).
ambient_c = 25.0
