coulomb_nm = 0.0
static_friction_nm = 0.0
stribeck_rad_s = 10.0
friction_band_rad_s = 10.0
# Волновая передача беззазорна; её потерянный ход — податливость, она в coupling_stiffness.
backlash = 0.0
# Крутильная жёсткость волновой передачи типоразмера 25 — порядок по каталогу HD, не сверено.
coupling_stiffness = 20000.0
# c = 2ζ√(K/w), ζ = 0.3 (конструкционное затухание передачи, оценка), w = 115.0 1/(кг·м²) — обратная
