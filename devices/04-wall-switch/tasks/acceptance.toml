version = 1
control = "../control.toml"
profile = "profile.toml"

[fault_sweep]
at_ns = 145000000
# Диапазоны тока и механического хода сохраняются при отказе.
invariant_limits = true
source = { kind = "derived", reference = "Момент отключения в существующих опытах обрыва датчика и питания." }

[[modes]]
id = "нажатие"
horizon_ns = 220000000
before_ns = 50000000
after_ns = 55000000
max_gap_ns = 1000000
source = { kind = "derived", reference = "0.12 с/60° из этапа 2 и 55 мс после инъекции. Физика 1 МГц." }
excitation = "нагрузка"
stimuli = [
  { id = "нагрузка", signal = { name = "выключатель/нагрузка", unit = "N*m" }, at_ns = 70000000, value = -0.002, comparison_value = 0.0, source = { kind = "derived", reference = "Известная сила 0.25 Н на плече 8 мм из switch.toml." } },
]

[[modes.faults]]
fault = { node = "sensor:рычаг/измерение", kind = "sensor_unavailable" }
at_ns = 145000000
source = { kind = "derived", reference = "Отключение до конца моделируемого стенда; 55 мс наблюдения после." }

[[modes.faults]]
fault = { node = "power:нажиматель/скважность-power", kind = "power_cut" }
at_ns = 145000000
source = { kind = "derived", reference = "Отключение до конца моделируемого стенда; 55 мс наблюдения после." }

[[criteria]]
case = { path = "мост", mode = "нажатие" }
limits = [
  { kind = "range", signal = { name = "реакция пары", unit = "N" }, min = 0, source = { kind = "derived", reference = "Контакт односторонний, нормальная реакция неотрицательна." } },
  { kind = "range", signal = { name = "qpos[0]", unit = "rad" }, min = -0.10, max = 1.10, source = { kind = "derived", reference = "Границы -5°…60° и запас до 1.10 рад на податливость стенда." } },
  { kind = "range", signal = { name = "qpos[1]", unit = "rad" }, min = -0.02, max = 0.24, source = { kind = "derived", reference = "12° из switch.toml и допуск мягкого контакта модели." } },
  { kind = "range", signal = { name = "нажиматель/мотор/current_a", unit = "A" }, min = -0.70, max = 0.70, source = { kind = "derived", reference = "Стоповый ток модели MG90S при 4.8 В." } },
]
response = { signal = { name = "qpos[1]", unit = "rad" }, min_change = 0.002, within_ns = 55000000, source = { kind = "derived", reference = "Порог 0.002 рад различает ход клавиши и прогиб ограничения." } }

[[criteria]]
case = { path = "мост", mode = "нажатие", fault = { node = "sensor:рычаг/измерение", kind = "sensor_unavailable" } }
