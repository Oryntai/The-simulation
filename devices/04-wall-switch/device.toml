format = 3
name = "Нажиматель MG90S"

[[links]]
name = "корпус"
joint = { kind = "fixed" }
mass = { kind = "massless" } # Неподвижная опора, инерция корпуса в ось не включается.

[[links.collision]]
# Габариты TowerPro 22.8 × 12.2 × 28.5 мм. Корпус закреплён под плоскостью рычага.
shape = { kind = "box", size_m = [0.0228, 0.0122, 0.0285] }
pose = { position_m = [-0.007, 0.0, -0.01825] } # Предложенное расположение оси на корпусе.

[[links]]
name = "рычаг"
parent = "корпус"

[links.joint]
kind = "hinge"
name = "ось"
axis = [0.0, 0.0, 1.0]
# Инерция рычага по геометрии, ротора — в модели привода.
armature = 0.0
damping = 0.0
friction_loss = 0.0
efforts = [{ name = "скважность", dof = 0 }, { name = "скважность-power", dof = 0 }, { name = "нагрузка", dof = 0 }]

[links.mass]
kind = "geometry"
material = { name = "PETG", density_kg_m3 = 1270.0, provenance = { estimate = "Та же оценка плотности PETG, что в devices/07-balance-cart/device.toml. Нужен замер напечатанного рычага." } }

[[links.collision]]
# Эскиз рычага: 33 × 7 × 6 мм, от оси до конца 33 мм. Jz = 6.46147e-7 кг·м².
shape = { kind = "box", size_m = [0.033, 0.007, 0.006] }
pose = { position_m = [0.0165, 0.0, 0.0] }
friction = [0.0, 0.0, 0.0] # Контакт по нормали, свойства пары отложены до этапа 4.

[[drives]]
name = "мотор"
part = "mg90s-open-loop"
effort = "скважность"

[drives.params]
# Входы: catalog/drives/mg90s.toml, 4.8 В, Istall=0.7 A, Tstall=0.1765197 Н·м,
# ω0=π/3 / 0.12 с. TowerPro даёт 0.10 с при том же напряжении; варианты расходятся.
# Средний мост без падения напряжения: R=U/Istall, ограничение опыта равно Istall.
resistance_ohm = 6.857142857142858
current_limit_a = 0.7
# Из stall/no-load L не определить. Аналог maxon DCX 6 M, обмотка 4.5 В:
# L=R·(0.0711 мГн / 20.8 Ом). https://www.maxongroup.com/medias/sys_master/root/8881015652382/EN-21-085.pdf
inductance_h = 2.343956043956044e-5
# Из выходных точек N не определить. Аналог Mabuchi FF-030PK-11160:
# N=(13800 об/мин · 4.8/5 В)/(83.3333 об/мин). https://product.mabuchi-motor.com/detail.html?id=20
gear_ratio = 158.976
# I0≈Istall·(0.066/0.91) по Mabuchi, около 0.05077 A. k=(U−R·I0)/(N·ω0).
motor_constant = 0.0032089529854170966
# Выходные kt=Tstall/Istall=0.252171 Н·м/А и ke=(U−R·I0)/ω0=0.510147 В·с/рад.
# Их нельзя приравнять. Прямой КПД η=kt/ke=0.494311 (без поправки I0: 0.458460).
gear_efficiency = 0.4943109384284195
# Для обратного хода данных нет. Симметричный КПД — отдельное допущение.
backward_efficiency = 0.4943109384284195
# Вязкий эквивалент потерь: B=k·I0/(N·ω0). Кулоново трение и страгивание
# отделить от него по одной точке нельзя. Нули отключают эти слагаемые.
viscous_nm_per_rad_s = 1.174316059273596e-7
coulomb_nm = 0.0
static_friction_nm = 0.0
# Положительный масштаб равен N·ω0. Регуляризация не влияет при нулевом сухом трении.
stribeck_rad_s = 1387.3273158252525
friction_band_rad_s = 1387.3273158252525
# 0.0179 г·см² по таблице maxon DCX 6 M, не идентификация ротора MG90S.
rotor_inertia_kg_m2 = 1.79e-9
# Неизвестные инерции ступеней исключены из стенда.
gear_input_inertia_kg_m2 = 0.0
# Гипотеза для стенда: полный люфт 0.5°, прогиб 0.5° под Tstall.
# K=Tstall/(π/360). c=2ζ√(K·J_прив), ζ=1/√2, J_прив=(1/Jрычага+1/(Jрот·N²·η))⁻¹.
backlash = 0.008726646259971648
coupling_stiffness = 20.227667621830875
coupling_damping = 0.0050404381223863775
# Внешние упоры по эскизу (−5°, 60°). Kstop=Tstall/(1° в рад):
# проектный бюджет статического прогиба 1° при паспортном моменте.
# Отдельный демпфер отсутствует в эскизе, затухание даёт модель передачи.
stop_min = -0.08726646259971647
stop_max = 1.0471975511965976
stop_stiffness = 10.113833810915438
stop_damping = 0.0
# Идеальный мост принимает CSV на сетке физики без транспортной задержки.
control_hz = 1000000.0
bus_delay_s = 0.0

[[sensors]]
name = "ток"
part = "ina219"
drive = "мотор"

[sensors.params]
# 1 кГц даёт отсчёты каждые 1 мс на сетке физики. Задержка стенда 1 период.
rate_hz = 1000.0
latency_s = 0.001
# Синтетическая калибровка без ошибок. Квант 1 мА из калибровки стенда,
# не паспортный шаг INA219: на железе требуется выбор и замер шунта.
quantum = 0.001
bias = 0.0
noise_std = 0.0
drift_per_s = 0.0
drift_rw_std = 0.0
drop_probability = 0.0
fault = 0.0
saturation = 0.0
