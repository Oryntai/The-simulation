world = "../world.toml"
window_ns = [0, 125000000]
source = "Начальный опыт неизменённой сцены этапа 3 до 125 мс. Старый пик на 122.88 мс."

[joint_limit]
time_constant_s = { value = 0.0002, source = { estimate = "Диагностическое уменьшение времени мягкого ограничения 0.02 с в 100 раз. Положение упора не меняется." } }
damping_ratio = { value = 1, source = { estimate = "Относительное демпфирование по умолчанию MuJoCo." } }
impedance = [{ value = 0.9999, source = { estimate = "Численный предел приближается к жёсткому благодаря постоянному импедансу; калибровка железа не задана." } }, { value = 0.9999, source = { estimate = "Численный предел приближается к жёсткому благодаря постоянному импедансу; калибровка железа не задана." } }, { value = 0.001, source = { estimate = "Численный предел приближается к жёсткому благодаря постоянному импедансу; калибровка железа не задана." } }, { value = 0.5, source = { estimate = "Численный предел приближается к жёсткому благодаря постоянному импедансу; калибровка железа не задана." } }, { value = 2, source = { estimate = "Численный предел приближается к жёсткому благодаря постоянному импедансу; калибровка железа не задана." } }]
[control]
wiring = "../control.toml"

[[control.measurements]]
signal = { name = "рычаг/измерение", unit = "rad" }
rate_hz = 5000
source = { kind = "estimate", reference = "Та же шкала ADC и те же отсчёты, что в профиле этапа 3." }
transducer = { kind = "rotary_position", joint = "нажиматель/ось" }

[models."нагрузка"]
kind = "effort"
channel = "выключатель/нагрузка"
source = "Известная сила 0.25 Н на плече 8 мм из прежней задачи."
values = [{ at_ns = 0, value = 0 }, { at_ns = 70000000, value = -0.002 }]

[[criteria]]
name = "угол исходной геометрии"
unit = "rad"
series = { position = 1 }
statistic = "maximum"
tolerance = { value = 0.002, source = { datasheet = "Неизменный предел эскиза 12°." } }
remainder = [{ value = 0.0, source = { estimate = "Остаток за пределами двух наблюдаемых разностей не оценён." } }, { value = 0.0, source = { estimate = "Остаток проверки решателя не оценён." } }, { value = 0.0, source = { estimate = "Разброс материалов требует стенда." } }]
upper = { value = 0.20943951023931953, source = { datasheet = "Неизменный предел эскиза 12°." } }
