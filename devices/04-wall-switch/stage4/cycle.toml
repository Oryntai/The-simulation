window_ns = [10000000, 960000000]
source = "Два полных цикла нажатия, отвода, обратного нажатия и повторного отвода за 0.96 с."

[contacts]
table = "../../../catalog/contact/fixture.toml"

[contacts.solver]
# Параметры опыта. Удвоение числа итераций — независимая проба сходимости решателя.
method = "newton"
elliptic = true
impratio = 1.0
tolerance = 1e-10
iterations = 100
line_search_tolerance = 0.01
line_search_iterations = 50
noslip_tolerance = 1e-6
noslip_iterations = 0
ccd_tolerance = 1e-6
ccd_iterations = 50

[contacts.alternative_solver]
# Параметры опыта. Удвоение числа итераций — независимая проба сходимости решателя.
method = "newton"
elliptic = true
impratio = 1.0
tolerance = 1e-10
iterations = 200
line_search_tolerance = 0.01
line_search_iterations = 50
noslip_tolerance = 1e-6
noslip_iterations = 0
ccd_tolerance = 1e-6
ccd_iterations = 50

[contacts.assignments]
"стенд/клавиша/collision/0" = "пластина"
"стенд/толкатель/collision/0" = "шток"
"стенд/толкатель/collision/1" = "шток"

[[contacts.pairs]]
geometries = ["стенд/клавиша/collision/0", "стенд/толкатель/collision/0"]
solimp = [0.95, 0.95, 0.001, 0.5, 2.0]
source = { estimate = "Постоянный импеданс для численного стенда, физическая калибровка требуется." }

[[contacts.pairs]]
geometries = ["стенд/клавиша/collision/0", "стенд/толкатель/collision/1"]
solimp = [0.95, 0.95, 0.001, 0.5, 2.0]
source = { estimate = "Постоянный импеданс для численного стенда, физическая калибровка требуется." }

[models."ход"]
kind = "coordinate"
joint = "стенд/ход"

[models."детент"]
kind = "elastic_axis"
joint = "стенд/ход"
channel = "стенд/защёлка"
source = "Эскизный бистабильный механизм. Устойчивые положения 0.025 и 0.145 рад внутри прежнего предела, пороги переключения 0.06 и 0.115 рад. Пружина и демпфер — гипотезы стенда, нужна кривая усилия."
stiffness = 0.02
damping = 0.0001
seats = [0.025, 0.145]
detent = { below = 0.06, above = 0.115, minimum_contact_n = 0.02, positive_pair = ["стенд/клавиша/collision/0", "стенд/толкатель/collision/0"], negative_pair = ["стенд/клавиша/collision/0", "стенд/толкатель/collision/1"] }
[models."толкатель"]
kind = "elastic_axis"
joint = "стенд/поворот"
channel = "стенд/привод"
source = "Стендовый задающий кулачок: плечо 8 мм, ход 0.30 рад покрывает зазор 1 мм и рабочие 0.145 рад. Для обратного порога 0.06 рад нужно около 0.065 рад геометрического хода плюс 0.02·(0.145−0.06)/0.05≈0.034 рад упругого смещения. Команда −0.12 рад даёт запас 0.021 рад до срабатывания и оставляет нейтральный зазор при 0 рад клавиши. Жёсткость 0.05 Н·м/рад и демпфер 0.00017 Н·м·с/рад (порядка критического)."
stiffness = 0.05
damping = 0.00017
seats = [0.0, 0.0]
rest = [{ at_ns = 0, value = 0 }, { at_ns = 50000000, value = 0.3 }, { at_ns = 150000000, value = 0 }, { at_ns = 280000000, value = -0.12 }, { at_ns = 380000000, value = 0 }, { at_ns = 510000000, value = 0.30 }, { at_ns = 610000000, value = 0 }, { at_ns = 740000000, value = -0.12 }, { at_ns = 840000000, value = 0 }]
[models."цепь"]
kind = "electrical"
latch = "детент"
initially_closed = false

source = { estimate = "Нормированная шкала бистабильного механизма стенда." }
closed_ohm = { value = 0.1, source = { estimate = "Условный резистивный контакт стенда. Требуется четырёхпроводный замер." } }
open_ohm = { value = 1000000000.0, source = { estimate = "Допущение модели изоляции сухой цепи." } }
source_ohm = { value = 0.15, source = { estimate = "Эскиз источника, нужно измерение внутреннего сопротивления." } }
load_ohm = { value = 100, source = { datasheet = "Тестовая резистивная нагрузка по схеме стенда." } }
supply_v = { value = 4.8, range = [0, 4.8], source = { estimate = "Стабилизированная шина этапа 2 и опыт слабой шины." } }
bounce_duration_s = { value = 0.001, source = { estimate = "Диагностическая модель без дребезга: весь первый интервал 1 мс следует новому состоянию." } }
[states]
"детент" = ["свободно", "зафиксировано", "свободно", "зафиксировано", "свободно"]
"цепь" = ["разомкнуто", "замкнуто", "разомкнуто", "замкнуто", "разомкнуто"]

