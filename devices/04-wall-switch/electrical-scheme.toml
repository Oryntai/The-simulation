[connections.plug_signal]
kind = "plug"
ends = ["header_signal/contact", "servo/pwm"]
resistance_ohm = { measurement = "Четырёхпроводно измерить сопротивление участка и стыка без питания." }
current_limit_a = { measurement = "Подтвердить ток по проводу, контакту и длительности с контролем нагрева." }
after = ["servo_signal_finish", "servo_return_finish"]

[rails."силовая"]
ends = ["servo/p", "servo/g"]
reverse_limit_v = { measurement = "Подтвердить обратное напряжение и предел защиты экземпляра." }

[rails.vdd]
ends = ["board/p", "board/g"]
reverse_limit_v = { measurement = "Подтвердить обратное напряжение и предел защиты экземпляра." }

[[bindings]]
ends = ["servo/p", "servo/g"]
target = { kind = "drive_power", drive = "мотор" }

[[bindings]]
ends = ["board/p", "board/g"]
target = { kind = "board_power", board = "плата", rail = "vdd" }

[[bindings]]
ends = ["board/gpio0"]
target = { kind = "board_pin", board = "плата", pin = "0", function = "adc" }

[[bindings]]
ends = ["board/gpio4"]
target = { kind = "board_pin", board = "плата", pin = "4", function = "pwm" }

[[modes.cases]]
mode = { kind = "normal" }
source = { derived = "Пара опыта задаёт сильную и слабую полки питания. События в 2 и 4 мс кратны обмену платы 200 мкс из control.toml. Токи и детектор перенесены из синтетического блока рантайма." }
probes = [{ kind = "voltage", ends = ["board/p", "board/g"] }]

[[modes.cases.pins]]
board = "плата"
pin = "4"
rail = "vdd"
phase = { kind = "working", pin = { state = "high_z", source = { derived = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не аттестованы." } } }
unpowered = { state = "high_z", source = { derived = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не аттестованы." } }
reset = { state = "high_z", source = { derived = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не аттестованы." } }
model = { input_ohm = { measurement = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не аттестованы.", range = { min = 1000000.0, nominal = 1000000.0, max = 1000000.0, source = { derived = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не аттестованы." } } }, high_z_ohm = { measurement = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не аттестованы.", range = { min = 1000000.0, nominal = 1000000.0, max = 1000000.0, source = { derived = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не аттестованы." } } }, high_ohm = { measurement = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не аттестованы.", range = { min = 10.0, nominal = 10.0, max = 10.0, source = { derived = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не аттестованы." } } }, low_ohm = { measurement = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не аттестованы.", range = { min = 10.0, nominal = 10.0, max = 10.0, source = { derived = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не аттестованы." } } }, pull_up_ohm = { measurement = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не аттестованы.", range = { min = 1000.0, nominal = 1000.0, max = 1000.0, source = { derived = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не аттестованы." } } }, pull_down_ohm = { measurement = "Эквиваленты линий стендового блока рантайма: выход 10 Ом, подтяжка 1 кОм, вход и утечка 1 МОм. Защитные пути не атте