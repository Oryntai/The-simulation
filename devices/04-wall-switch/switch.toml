format = 3
name = "Механика настенного выключателя"

[[links]]
name = "панель"
joint = { kind = "fixed" }
mass = { kind = "massless" }

[[links.visual]]
# Габарит условной лицевой панели в эскизе, установленной на стене.
shape = { kind = "box", size_m = [0.075, 0.004, 0.075] }
pose = { position_m = [0.0, 0.043, 0.0] }

[[links]]
name = "клавиша"
parent = "панель"
# Ось сбоку от точки нажатия. Защёлка, пружина и электрический контакт на этапе 4.
pose = { position_m = [0.026, 0.030, 0.0] }

[links.joint]
kind = "hinge"
name = "ось"
axis = [0.0, 0.0, -1.0]
# Ход условной клавиши по эскизу. Потери в оси вынесены на этап 4.
limits_deg = [0.0, 12.0]
damping = 0.0
friction_loss = 0.0
armature = 0.0
# Свободный канал известной стендовой нагрузки.
efforts = [{ name = "нагрузка", dof = 0 }]

[links.mass]
kind = "geometry"
material = { name = "ABS", density_kg_m3 = 1050.0, provenance = { estimate = "Типовая оценка плотности ABS для эскизной клавиши. Нужна фактическая масса." } }

[[links.collision]]
# Пятно клавиши по эскизу, центр на 8 мм сбоку от оси и на 2 мм ближе к рычагу.
shape = { kind = "box", size_m = [0.014, 0.004, 0.015] }
pose = { position_m = [-0.008, -0.002, 0.0] }
friction = [0.0, 0.0, 0.0] # Нормальный контакт, без данных пары материалов.
