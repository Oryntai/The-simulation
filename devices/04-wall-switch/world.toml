format = 3
name = "Нажиматель настенного выключателя"
# Фиксированное зерно приёмочного стенда.
seed = 4
# Оценка локальной точности sim-drive требует ≥ 19972 Гц (по K, c и инерциям).
# Сверка всей кривой удержанного момента с эталоном 1 МГц исключает более
# редкие сетки: их такты не совпадают со скачками при выборе люфта.
# CSV подаёт отключение на такте 239,999 мс, привод видит его в 240 мс.
# Сдвиг на такт меняет переход; перенос CSV на другую сетку требует повторной сверки.
physics_hz = 1000000
# Нормальное ускорение по СИ. Оси звеньев перпендикулярны плоскости стены или параллельны ей.
gravity_m_s2 = [0.0, 0.0, -9.80665]

[environment]
# Силы воздуха в стенде отключены.
density_kg_m3 = 0.0
viscosity_pa_s = 0.0
wind_m_s = [0.0, 0.0, 0.0]

[[environment.collision]]
# Участок плоской стены по компоновочному эскизу, поверхность на y = 45 мм.
shape = { kind = "box", size_m = [0.15, 0.010, 0.15] }
pose = { position_m = [0.0, 0.050, 0.0] }
friction = [0.0, 0.0, 0.0] # Приёмка без гипотезы о трении пары материалов.

[[devices]]
name = "нажиматель"
file = "device.toml"

[[devices]]
name = "выключатель"
file = "switch.toml"
