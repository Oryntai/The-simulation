reason_contains = "пиковый ток"
expected = 0.5 # 6 В / (1 + 1 + 10) Ом.
tolerance = 1e-10
pair_assembly = "processes"
pair_mode = "circuit-normal"
pair_metric = "пиковый ток"
pair_expected = 0.1 # 6 В / (1 + 1 + 58) Ом.

[[witnesses]]
assembly = "processes"
class = "thread_failure"
object = "стык"
mode = "thread-strip"
reason_contains = "срыв при превышении допустимой упругой невязки резьбы"
expected = 0.000025 # x ≈ (F/M)·t²/2 = (1/2)·(10 мс)²/2, до поправки упругого участка.
tolerance = 0.000004 # Допуск осевой реакции исходной сверки 0,004 Н делён на 1000 Н/м.
pair_assembly = "processes"
pair_mode = "thread-normal"
pair_metric = "невязка резьбы"
pair_expected = 0.0000024896006581881 # Точное решение e''+k(1/M+a²/J)e=F/M на 10 мс при F=0,1 Н.
pair_tolerance = 0.0000004 # Десятая доля допуска того же линейного расчёта при десятикратном уменьшении силы.

[[witnesses]]
assembly = "mechanical-unsafe"
class = "fatigue"
object = "стержень"
mode = "fatigue"
expected = 122230996.29457562 # 12 Н·м / (π · 0,01³ / 32).
tolerance = 10.0 # Допуск сверки реакции выдержанного стыка с приложенным моментом: 1 мкН·м / W ≈ 10 Па.
pair_assembly = "mechanical-safe"
pair_expected = 61115498.14728781 # 6 Н·м / W.
mechanical = { criterion = "амплитуда изгиба", upper = 78551000, reason_contains = "симметричного изгиба" }

[[witnesses]]
assembly = "mechanical-unsafe"
class = "retention"
object = "стык"
mode = "retention"
tolerance = 1e-10 # Округление рекурсии на трёх временных сетках.
pair_assembly = "mechanical-safe"
# Ручная рекурсия для массы 1 кг: v′=v+h(F−P), x′=x+h·v′,
# P=20−500x со второго шага, x₀=0,02 м. На первом шаге P=0.
# Свидетель берёт максимум F−(20−500x′) после захвата до отрыва.
mechanical = { criterion = "дефицит удержания", upper = 0, reason_contains = "произошёл отрыв", grid_reference = [[4.022070059519686, 4.006148222403295, 3.999506397765149], [-0.9778422425746296, -0.9943569410043551, -0.9985926218809684]] }

[[witnesses]]
assembly = "mechanical-unsafe"
class = "connection_failure"
object = "стык"
mode = "connection_failure"
# d(0)=0,9 и a=(1−d)·aсвоб+d·aопор:
# https://mujoco.readthedocs.io/en/stable/modeling.html#solver-parameters
expected = 4.5 # Из покоя при нулевом зазоре Fweld=d(0)·F=0,9 Н. Делим на 0,2 Н.
tolerance = 0.01 # В контрольной паре допускается переходный перебег не выше 2% от установившейся загрузки.
pair_assembly = "mechanical-safe"
pair_expected = 0.5 # Баланс постоянной нагрузки: 1 Н / 2 Н.
mechanical = { criterion = "загрузка стыка", upper = 1, reason_contains = "связь разорвана" }

[[witnesses]]
assembly = "mechanical-unsafe"
class = "impact"
object = "опора"
mode = "impact"
tolerance = 1e-10 # Допуск баланса импульса по скорости после отскока: округление сумм до 800 шагов.
pair_assembly = "mechanical-safe"
# Независимый баланс J = F·10 мс + m·v после отскока, на каждой сетке.
mechanical = { criterion = "импульс", upper = 0.6, reason_contains = "Один прямой удар", momentum = { final_speed = "конечная скорость", incoming_impulses = [1.0, 0.25], mass_kg = 1.0 } }

[[witnesses]]
