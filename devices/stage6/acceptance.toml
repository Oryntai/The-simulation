object = "зазор"
mode = "pinch"
expected = 4.0 # Два независимых равновесия на общей оси: Nправ = F, Nлев = Nправ.
tolerance = 0.001 # Разрешение сверки 0,1% от силы меньшего опыта.
pair_assembly = "mechanical-safe"
pair_expected = 1.0 # У контрольной пары та же геометрия, усилие подачи 1 Н.
mechanical = { criterion = "сжатие", upper = 2, reason_contains = "встречное сжатие" }

[[witnesses]]
