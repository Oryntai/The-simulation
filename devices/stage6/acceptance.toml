# Свидетельства корпуса проверяются в своей ограниченной области. Параметры
# независимого расчёта ниже читаются тестом и не входят в аргументы sim-run.
[[witnesses]]
assembly = "over-strength"
class = "static_strength"
object = "каретка/стержень"
mode = "loaded"
reason_contains = "напряжения изгиба по модулю сечения"
expected = 7500000.0 # M/W = 40/(0,02·0,04²/6) Па.
tolerance = 1e-8
pair_assembly = "under-travel"

[[witnesses]]
assembly = "over-travel"
class = "travel_jam"
object = "каретка/стержень"
mode = "loaded"
reason_contains = "наблюдалось нарушение критерия"
expected = 0.000014 # Начальный 1 мкм + перемещения 1, 2, 4 и 6 мкм на четырёх шагах Euler.
tolerance = 1e-14
pair_assembly = "under-travel"

[[witnesses]]
assembly = "falling"
class = "fall"
object = "стойка/блок"
mode = "observation"
reason_contains = "наблюдалось нарушение критерия"
expected = 0.0199 # 20 мм − 10 м/с² · (4²+4)·(1 мс)²/2.
tolerance = 1e-14
pair_assembly = "supported"

[[witnesses]]
assembly = "processes"
class = "stored_energy"
object = "накопитель"
mode = "spring-energy"
reason_contains = "запасено не менее"
expected = 1.0 # 200 Н/м · (0,1 м)²/2.
tolerance = 1e-10
pair_assembly = "processes"
pair_mode = "spring"
pair_metric = "запас энергии"
pair_expected = 0.04 # 200 Н/м · (0,02 м)²/2.

[[witnesses]]
