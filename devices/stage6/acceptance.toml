mode = "nominal"
repeat = "02/independent"
repeat_mode = "independent"
measurements = ["провис", "разгрузка", "длина в нейтрали", "кинематика"]
tolerance = 1e-9 # Допуск стадии 5 для той же геометрии и временной сетки.

[corpus]
# Реестр учитывает дополнительные классы условий доказательства. Инвентарь,
# полнота исполнения и общий критерий постановки не являются опасностью корпуса.
# Открытые вычислительные пары отсутствуют. Для tissue_load и ingress вход
# синтетический, поэтому живые физические свидетельства для этих классов открыты.
open = []

[corpus.gaps]
