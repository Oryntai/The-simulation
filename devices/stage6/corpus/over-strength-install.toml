version = 1
snapshot_ns = 2000000 # На границе двух интервалов, до второй команды.

[[paths]]
station = "stand"
mode = "loaded"
path = "axis"
source = { kind = "datasheet", reference = "Спецификация нейтрального стенда: два интервала по 2 мс, ход ограничен 8 мкм, изгиб вдоль оси стержня." }
grids = [{ id = "base", hz = 1000, source = { kind = "datasheet", reference = "Спецификация нейтрального стенда: два интервала по 2 мс, ход ограничен 8 мкм, изгиб вдоль оси стержня." } }]

[[checks]]
class = "travel_jam"
object = "каретка/стержень"
window = { start_ns = 0, end_ns = 4000000, max_gap_ns = 1000000 }
applicability = { kind = "datasheet", reference = "Спецификация нейтрального стенда: два интервала по 2 мс, ход ограничен 8 мкм, изгиб вдоль оси стержня." }
scope = "Ход из начальной координаты по одной оси. Предельный зазор 8 мкм задан геометрией оснастки."
inputs = [{ kind = "datasheet", reference = "Спецификация нейтрального стенда: два интервала по 2 мс, ход ограничен 8 мкм, изгиб вдоль оси стержня." }]
verification = { kind = "truth", limit = { kind = "range", signal = { name = "qpos[0]", unit = "m" }, max = 0.000008, source = { kind = "datasheet", reference = "Спецификация нейтрального стенда: два интервала по 2 мс, ход ограничен 8 мкм, изгиб вдоль оси стержня." } } }

[[checks]]
class = "static_strength"
object = "каретка/стержень"
window = { start_ns = 0, end_ns = 4000000, max_gap_ns = 1000000 }
applicability = { kind = "datasheet", reference = "Спецификация нейтрального стенда: два интервала по 2 мс, ход ограничен 8 мкм, изгиб вдоль оси стержня." }
scope = "Независимая статическая нагрузка поперёк прямоугольного стержня длиной 1 м."
inputs = [{ kind = "datasheet", reference = "Спецификация нейтрального стенда: два интервала по 2 мс, ход ограничен 8 мкм, изгиб вдоль оси стержня." }]
# M = F·1 м. Порог 5 МПа принят в приёмке синтетической постановки B.
verification = { kind = "section", geometry = 0, axis = "x", moment_nm = [40.0, 40.0], allowable_pa = [5000000.0, 5000000.0], load = { kind = "datasheet", reference = "Стенд статической нагрузки: 40 Н на плече 1 м." }, limit = { kind = "datasheet", reference = "Расчётный предел 5 МПа из приёмки B для синтетического материала." } }
