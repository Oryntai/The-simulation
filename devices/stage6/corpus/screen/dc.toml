world = "../../../stage4-processes/world-energy.toml"
# После первого такта DC-ветвь наблюдается ровно 10 с по протоколу сравнительного опыта.
window_ns = [1000000, 10001000000]
source = "Синтетическая DC-цепь контакта без кожной динамики: постоянное сопротивление заменяет путь тока снизу вверх."

[screen]
object = "контакт"
scope = "Доступные полюса без ограждения и отключения. Сухое касание малой площади, постоянный ток от стоп к руке, 10 с. Сопротивление 1 кОм относится к численной нагрузке."
source = { kind = "datasheet", reference = "Численный стенд: резистивный эквивалент пути 1 кОм при заданных контактах, постоянное напряжение, отсутствие ограждения и отключения." }
limit_source = { kind = "paper", reference = "IEC 60479-1:2018, рис. 22, граница a (DC-1), продольный ток снизу вверх. 2 мА подтверждены для предшествующей IEC TS 60479-1:2005 в NASA NESC-RP-13-00869, приложение A, §6.1 и табл. 13: https://ntrs.nasa.gov/api/citations/20150014351/downloads/20150014351.pdf. Рис. 22 издания 2018 требует сверки с лицензированным текстом: https://webstore.iec.ch/en/publication/62980." }
limit = 0.002 # 2 мА, порог реакции DC-1 для расчётного опыта.

[screen.condition]
kind = "accessible_dc"
# При положительной ЭДС ток течёт от первого полюса ко второму.
live_parts = ["контакт/стопы", "контакт/рука"]
path_when_positive = ["feet", "hand"]
limit_path = ["feet", "hand"]
limit_duration_ns = 10000000000 # Зафиксированная выдержка корпуса из диапазона рис. 22.
guarding = false
ripple_free = true
voltage_only_protection = true
exposure = "dry_small_area"
dry_limit_v = 60 # IEC 60364-4-41, §414.4.5, сухо без ожидаемого контакта большой площади.
wet_limit_v = 30 # IEC 60364-4-41, §414.4.5, прочие условия. Для носимого только отсев.
voltage_source = "IEC 61140:2016, §§4–5, https://webstore.iec.ch/en/publication/23997. IEC 60364-4-41:2005+A1:2017, §§414.1, 414.4.5, https://webstore.iec.ch/en/publication/32936. 120 В DC относится к классу ELV. 60/30 В DC относятся к условиям основной защиты SELV/PELV. Значения и условия требуют сверки с лицензированным текстом. При контакте на теле требуется применимый стандарт изделия и проверка защиты во влажных условиях и при отказе."

[[criteria]]
name = "ток контакта"
series = { measurement = "контакт/current" }
unit = "A"
statistic = "minimum"
tolerance = { value = 1e-10, source = { datasheet = "Допуск обратной сверки резистивной цепи по Кирхгофу." } }
remainder = [
  { value = 0, source = { datasheet = "Ток постоянен без накопителей." } },
  { value = 0, source = { datasheet = "Электрическая цепь развязана с механикой." } },
  { value = 0, source = { datasheet = "Сопротивления цепи заданы точками." } },
]

[models."контакт"]
kind = "electrical"
initially_closed = false
fault = "stuck_closed"
source = { datasheet = "Оба доступных полюса подключены к эквиваленту тела на весь тест." }
closed_ohm = { value = 1, source = { datasheet = "Сопротивление контактов численного стенда суммарно 1 Ом." } }
open_ohm = { value = 1000000, source = { datasheet = "Номинал разомкнутого контакта численного стенда, здесь не применяется." } }
source_ohm = { value = 1, source = { datasheet = "Внутреннее сопротивление 1 Ом по схеме стенда." } }
load_ohm = { value = 1000, source = { datasheet = "Фиксированное сопротивление эквивалента пути 1 кОм для численной проверки." } }
supply_v = { value = 500, source = { datasheet = "Заданный идеальный источник 500 В без пульсаций для опыта превышения." } }
bounce_duration_s = { value = 0.001, source = { datasheet = "Параметр синтетического ключа, при постоянном замыкании не применяется." } }
