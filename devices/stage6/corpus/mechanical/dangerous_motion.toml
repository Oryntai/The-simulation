world = "world-block.toml"
window_ns = [0, 10000000]
source = "Блок приближается к доступной контрольной точке участника (неподвижный имитатор). Окно заканчивается до первого контакта."
hazard_witnesses = [{ class = "dangerous_motion", object = "каретка", criterion = "скорость сближения" }]

[models."нагрузка"]
kind = "effort"
channel = "стенд/сила"
source = "Условие стенда: импульс 100 Н в течение 10 мс; далее свободное движение. Парная нагрузка 25 Н той же длительности."
values = [{ at_ns = 0, value = -100 }, { at_ns = 10000000, value = 0 }]

[models."каретка"]
kind = "mechanical_monitor"
scope = "Блок приближается к доступной контрольной точке участника (неподвижный имитатор). Окно заканчивается до первого контакта."
upper = { value = 0.5, source = { datasheet = "Спецификация зоны: предел 0,5 м/с из v²=2 a d при отведённых под остановку 12,5 мм и торможении 10 м/с²." } }
observation = { kind = "closing", points = [{ body = "стенд/блок", local_m = [-0.01, 0, 0] }, { body = "стенд/опора", local_m = [0.01, 0, 0] }], reach_m = { value = 0.015001, source = { datasheet = "Начальный расчётный зазор 15 мм плюс 1 мкм на округление координат." } } }

[[criteria]]
name = "скорость сближения"
series = { measurement = "каретка/closing_speed" }
unit = "m/s"
statistic = "maximum"
upper = { value = 0.5, source = { datasheet = "Спецификация зоны: предел 0,5 м/с из v²=2 a d при отведённых под остановку 12,5 мм и торможении 10 м/с²." } }
tolerance = { value = 1e-8, source = { datasheet = "Бюджет округления для суммы 40 приращений скорости на самой мелкой сетке и проекции на направление оси." } }
remainder = [
  { value = 1e-10, source = { datasheet = "Бюджет округления для суммы 40 приращений скорости на самой мелкой сетке и проекции на направление оси." } },
  { value = 0, source = { datasheet = "Сходимость контролируется на трёх сетках и отдельно сверяется с аналитикой стенда." } },
  { value = 0, source = { datasheet = "Заданы фиксированные параметры синтетического опыта." } },
]
