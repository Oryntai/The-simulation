world = "../../../stage4-processes/world-bond.toml"
window_ns = [4000000, 200000000]
source = "Две мс отверждения после запроса, затем 1 Н до установления реакции."

hazard_witnesses = [{ class = "connection_failure", object = "стык", criterion = "загрузка стыка" }]

[models."стык"]
witness_limit = { value = 1, source = { datasheet = "Нормированная линейная огибающая WrenchCapacity: единица соответствует исчерпанию прочности стыка." } }
kind = "attachment"
mounts = ["стенд/опора/стык", "стенд/блок/стык"]
available_travel_m = { value = 0.04, source = { datasheet = "Расчётное условие только синтетического опыта." } }
requests = [{ at_ns = 1000000, action = "attach" }]
loading = { source = "Начало и величина задающей внешней осевой силы численного стенда.", steps = [{ at_ns = 0, force_n = [0, 0, 0], torque_nm = [0, 0, 0] }, { at_ns = 5000000, force_n = [1, 0, 0], torque_nm = [0, 0, 0] }] }

[models."стык".limits]
gap_m = { value = 0.03, source = { datasheet = "Расчётное условие только синтетического опыта." } }
lateral_m = { value = 0.001, source = { datasheet = "Расчётное условие только синтетического опыта." } }
axis_error_rad = { value = 0.01, source = { datasheet = "Расчётное условие только синтетического опыта." } }
speed_m_s = { value = 0.1, source = { datasheet = "Расчётное условие только синтетического опыта." } }
angular_speed_rad_s = { value = 0.1, source = { datasheet = "Расчётное условие только синтетического опыта." } }
required_travel_m = { value = 0.001, source = { datasheet = "Расчётное условие только синтетического опыта." } }
release_force_n = { value = 0.01, source = { datasheet = "Расчётное условие только синтетического опыта." } }
release_torque_nm = { value = 0.01, source = { datasheet = "Расчётное условие только синтетического опыта." } }
capacity = { force_n = { value = 2, source = { datasheet = "Расчётное условие только синтетического опыта." } }, torque_nm = { value = 1, source = { datasheet = "Расчётное условие только синтетического опыта." } } }

[models."стык".law]
type = "adhesive"
weld = "контакт"

[models."стык".law.parameters]
cure_s = { value = 0.002, source = { datasheet = "Расчётное условие только синтетического опыта." } }
compression_n = { value = 1, range = [0.8, 1.2], source = { datasheet = "Расчётное условие только синтетического опыта." } }
temperature_k = { value = 300, range = [299, 301], source = { datasheet = "Расчётное условие только синтетического опыта." } }

[models."стык".law.cure_observation]
# Условия зажима и камеры заданы для полного интервала отверждения. Прижим
# уравновешен оснасткой, поэтому до снятия оснастки нет результирующей внешней силы.
compression_n = { value = 1, source = { datasheet = "Расчётное условие только синтетического опыта." } }
temperature_k = { value = 300, source = { datasheet = "Расчётное условие только синтетического опыта." } }
gap_m = { value = 0, source = { datasheet = "Расчётное условие только синтетического опыта." } }
lateral_m = { value = 0, source = { datasheet = "Расчётное условие только синтетического опыта." } }
axis_error_rad = { value = 0, source = { datasheet = "Расчётное условие только синтетического опыта." } }
speed_m_s = { value = 0, source = { datasheet = "Расчётное условие только синтетического опыта." } }
angular_speed_rad_s = { value = 0, source = { datasheet = "Расчётное условие только синтетического опыта." } }


[[criteria]]
name = "загрузка стыка"
series = { measurement = "стык/wrench_utilization" }
unit = "1"
statistic = "maximum"
upper = { value = 1, source = { datasheet = "Нормированная линейная огибающая WrenchCapacity: единица соответствует исчерпанию прочности стыка." } }
tolerance = { value = 0.05, source = { datasheet = "Допуск 1% от расчётной загрузки 1 Н / 0,2 Н; остаток 0,1% от загрузки 5." } }
remainder = [
  { value = 0.005, source = { datasheet = "Допуск 1% от расчётной загрузки 1 Н / 0,2 Н; остаток 0,1% от загрузки 5." } },
  { value = 0, source = { datasheet = "Сходимость контролируется на трёх сетках и отдельно сверяется с аналитикой стенда." } },
  { value = 0, source = { datasheet = "Заданы фиксированные параметры синтетического опыта." } },
]

[states]
"стык" = ["Attached"]
