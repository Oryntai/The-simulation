# Порты X/Y/Z описывают ходовые каналы, а не количество и тип моторов. Outlet — граница питания. Проверять снятие разрешения до размыкания фланца. В численном опыте на outlet только разрядная ветвь.
format = 1
scope = "assembly"
name = "Питание портала и граница сменной оснастки"
nets = ["raw","return","protected","enable","lx","ly","lz","switched"]
bindings = [] # В механической сцене нет установленных электрических моделей привода или платы.

[components.supply]
part = "xyz_supply"
nets = { p = "raw", g = "return" }

[components.fuse]
part = "xyz_fuse"
nets = { input = "raw", output = "protected" }

[components.protected_trunk]
part = "xyz_cable"
nets = { a = "protected", b = "protected" }

[components.feed]
part = "xyz_cable"
nets = { a = "raw", b = "raw" }

[components.return_trunk]
part = "xyz_cable"
nets = { a = "return", b = "return" }

[components.control]
part = "xyz_controller"
nets = { p = "protected", g = "return", enable = "enable", limit_x = "lx", limit_y = "ly", limit_z = "lz" }

[components.control-feed]
part = "xyz_cable"
nets = { a = "protected", b = "protected" }

[components.control-return]
part = "xyz_cable"
nets = { a = "return", b = "return" }

[components.drive-x]
part = "xyz_axis_channel"
nets = { p = "protected", g = "return" }

[components.endstop-x]
part = "xyz_endstop"
nets = { p = "protected", g = "return", state = "lx" }

[components.drive-x-feed]
part = "xyz_cable"
nets = { a = "protected", b = "protected" }

[components.drive-x-return]
part = "xyz_cable"
nets = { a = "return", b = "return" }

[components.endstop-x-feed]
part = "xyz_cable"
nets = { a = "protected", b = "protected" }

[components.endstop-x-return]
part = "xyz_cable"
nets = { a = "return", b = "return" }

[components.limit-x]
part = "xyz_cable"
nets = { a = "lx", b = "lx" }

[components.drive-y]
part = "xyz_axis_channel"
nets = { p = "protected", g = "return" }

[components.endstop-y]
part = "xyz_endstop"
nets = { p = "protected", g = "return", state = "ly" }

[components.drive-y-feed]
part = "xyz_cable"
nets = { a = "protected", b = "protected" }

[components.drive-y-return]
part = "xyz_cable"
nets = { a = "return", b = "return" }

[components.endstop-y-feed]
part = "xyz_cable"
nets = { a = "protected", b = "protected" }

[components.endstop-y-return]
part = "xyz_cable"
nets = { a = "return", b = "return" }

[components.limit-y]
part = "xyz_cable"
nets = { a = "ly", b = "ly" }

[components.drive-z]
part = "xyz_axis_channel"
nets = { p = "protected", g = "return" }

[components.endstop-z]
part = "xyz_endstop"
nets = { p = "protected", g = "return", state = "lz" }

[components.drive-z-feed]
part = "xyz_cable"
nets = { a = "protected", b = "protected" }

[components.drive-z-return]
part = "xyz_cable"
nets = { a = "return", b = "return" }

[components.endstop-z-feed]
part = "xyz_cable"
nets = { a = "protected", b = "protected" }

[components.endstop-z-return]
part = "xyz_cable"
nets = { a = "return", b = "return" }

[components.limit-z]
part = "xyz_cable"
nets = { a = "lz", b = "lz" }

[components.key]
part = "xyz_power_gate"
nets = { input = "protected", output = "switched", enable = "enable", g = "return" }

[components.key-feed]
part = "xyz_cable"
nets = { a = "protected", b = "protected" }

[components.key-return]
part = "xyz_cable"
nets = { a = "return", b = "return" }

[components.permission]
part = "xyz_cable"
nets = { a = "enable", b = "enable" }

[components.outlet]
part = "xyz_portal_connector"
nets = { p = "switched", g = "return", p_tail = "switched", g_tail = "return" }

[components.outlet-feed]
part = "xyz_cable"
nets = { a = "switched", b = "switched" }

[components.outlet-return]
part = "xyz_cable"
nets = { a = "return", b = "return" }

[components.monitor]
part = "xyz_outlet_monitor"
