# Электрический вариант той же механической постановки. Численные данные совпадают с одноимённым файлом на уровень выше.
format = 3
name = "отвёртка"
schematic = "../отвёртка-electrical.toml"

[[links]]
name = "основание"
joint = { kind = "free", name = "основание", damping = 0.0, friction_loss = 0.0, armature = 0.0 }
mass = { kind = "explicit", mass_kg = 0.02, com_m = [0.0,0.0,0.0], inertia_kg_m2 = [3e-06, 3e-06, 3e-06, 0, 0, 0], provenance = { estimate = "Численная масса стендовой компоновки с типовыми габаритами. Требуется взвешивание." } }

[[links.mounts]]
name = "фланец"
kind = "mechanical"
interface = "эскизный фланец стенда"

[[links.mounts]]
name = "силовой-вход"
kind = "power"
interface = "xyz_tool_proposal"

# Критическое гашение угловой моды от упругой подачи: 2√(J·k_z·(lead/2π)²).
[[links]]
name = "шпиндель"
parent = "основание"
joint = { kind = "hinge", name = "шпиндель", axis = [0, 0, 1], damping = 0.00003, friction_loss = 0.0, armature = 0.0, efforts = [{ name = "шпиндель", dof = 0 }] }
mass = { kind = "explicit", mass_kg = 0.004, com_m = [0.0,0.0,0.0], inertia_kg_m2 = [2e-07, 2e-07, 2e-07, 0, 0, 0], provenance = { estimate = "Численная масса стендовой компоновки с типовыми габаритами. Требуется взвешивание." } }

[[links]]
name = "резьба"
parent = "шпиндель"
pose = { position_m = [0, 0, -0.021] }
joint = { kind = "slide", name = "резьба", axis = [0, 0, -1], damping = 0.0, friction_loss = 0.0, armature = 0.0, efforts = [{ name = "резьба", dof = 0 }] }
mass = { kind = "explicit", mass_kg = 0.003, com_m = [0.0,0.0,0.0], inertia_kg_m2 = [1e-07, 1e-07, 1e-07, 0, 0, 0], provenance = { estimate = "Численная масса стендовой компоновки с типовыми габаритами. Требуется взвешивание." } }

[[links.collision]]
shape = { kind = "sphere", radius_m = 0.002 }
pose = { position_m = [0, 0, 0] }
contact_mask = [64, 128]

[[transmissions]]
kind = "screw"
name = "винтовая-пара"
input = "шпиндель"
output = "резьба"
lead_m_per_turn = 0.002
