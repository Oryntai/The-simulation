# Mating обозначает ответную половину portal/outlet. Она здесь представлена отдельно для испытания входа. Не включать диагностический источник в реальный монтаж.
format = 1
scope = "assembly"
name = "Нагреватель — локальный тракт питания"
nets = ["input","return","heater","enable","gated"]
bindings = [] # В механической сцене нет установленных электрических моделей привода или платы.

[components.mating]
part = "xyz_mating_boundary"
nets = { p = "input", g = "return" }

[components.inlet]
part = "xyz_tool_connector"
nets = { p = "input", g = "return", p_tail = "input", g_tail = "return" }

[components.load]
part = "xyz_heater_load"
nets = { p = "heater", g = "return" }

[components.load-return]
part = "xyz_cable"
nets = { a = "return", b = "return" }

[components.control]
part = "xyz_heater_control"
nets = { p = "input", g = "return", enable = "enable" }

[components.key]
part = "xyz_power_gate"
nets = { input = "input", output = "gated", enable = "enable", g = "return" }

[components.thermal]
part = "xyz_thermal_cutout"
nets = { input = "gated", output = "heater" }

[components.control-feed]
part = "xyz_cable"
nets = { a = "input", b = "input" }

[components.control-return]
part = "xyz_cable"
nets = { a = "return", b = "return" }

[components.key-feed]
part = "xyz_cable"
nets = { a = "input", b = "input" }

[components.key-return]
part = "xyz_cable"
nets = { a = "return", b = "return" }

[components.permission]
part = "xyz_cable"
nets = { a = "enable", b = "enable" }

[components.to-cutout]
part = "xyz_cable"
nets = { a = "gated", b = "gated" }

[components.load-feed]
part = "xyz_cable"
nets = { a = "heater", b = "heater" }

[connections.load-return-from]
kind = "solder"
ends = ["inlet/g_tail","load-return/a"]
after = []
resistance_ohm = { measurement = "Четырёхпроводно измерить указанный участок в обесточенном состоянии" }
current_limit_a = { measurement = "Определить допустимый постоянный и импульсный ток с учётом температуры и монтажа" }

[connections.load-return-to]
kind = "terminal"
ends = ["load-return/b","load/g"]
after = ["load-return-from"]
resistance_ohm = { measurement = "Четырёхпроводно измерить указанный участок в обесточенном состоянии" }
