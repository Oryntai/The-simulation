[rails.control]
ends = ["control/p","control/g"]
reverse_limit_v = { measurement = "Определить допустимое обратное напряжение по паспорту нагрузки и проверить маркировку до включения" }

[rails.inlet]
ends = ["inlet/p","inlet/g"]
