window_ns = [0, 400000000]
source = "Свободный блок с единичной массой, известная постоянная времени 1/100 с."

[models."пружина"]
kind = "elastic_axis"
channel = "объект/сила"
joint = "объект/направляющая"
source = "100 рад/с, критическое затухание 2mω, центр пружины 10 мм."
stiffness = 10000
damping = 200
seats = [0.01, 0.01]

[models."расстояние"]
kind = "coordinate"
joint = "объект/направляющая"

[[criteria]]
name = "координата"
unit = "m"
series = { measurement = "расстояние/position" }
statistic = "end"
tolerance = { value = 0.0001, source = { derived = "Порядок ошибки интегрирования при известной постоянной времени." } }
lower = { value = 0.00999, source = { derived = "x(t)=x₀·(1−(1+ωt)e^(−ωt)), точность сравнения 10 мкм." } }
upper = { value = 0.01001, source = { derived = "Та же аналитическая координата с допуском 10 мкм." } }
remainder = [
 { value = 0, source = { estimate = "Остаток интегрирования после трёх сеток не подтверждался." } },
 { value = 0, source = { estimate = "Отдельный вариант решателя не нужен для этого опыта без контакта." } },
 { value = 0, source = { estimate = "Единичная масса задана как синтетическая." } },
]

[[checks]]
name = "аналитическая конечная координата"
signal = "расстояние/position"
unit = "m"
window_ns = [380000000, 400000000]
min = { value = 0.00999, source = { derived = "x(t)=x₀·(1−(1+ωt)e^(−ωt)), точность сравнения 10 мкм." } }
max = { value = 0.01001, source = { derived = "Та же аналитическая координата с допуском 10 мкм." } }
