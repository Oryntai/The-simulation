[parts.xyz_heater_load.load]
ohm = { min = 100, nominal = 100, max = 100, source = { estimate = "Оценка, замерить ВАХ нагрузки. Здесь 100 Ом из reference_load в catalog/electrical/reference.toml, условная нагрузка для сверки монтажа." } }

[parts.xyz_grip_channel.load]
ohm = { min = 100, nominal = 100, max = 100, source = { estimate = "Оценка, замерить ВАХ нагрузки. Здесь 100 Ом из reference_load в catalog/electrical/reference.toml, условная нагрузка для сверки монтажа." } }

[parts.xyz_spindle_channel.load]
ohm = { min = 100, nominal = 100, max = 100, source = { estimate = "Оценка, замерить ВАХ нагрузки. Здесь 100 Ом из reference_load в catalog/electrical/reference.toml, условная нагрузка для сверки монтажа." } }
