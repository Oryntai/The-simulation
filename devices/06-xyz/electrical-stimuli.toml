# Диапазоны принадлежат только численному опыту, включая точечные значения эталонов.
# Они не ограничивают диапазон параметров железа. Замеры перечислены в catalog/electrical/depth-modules.toml и схемах.
format = 1

[parts.xyz_supply.emf]
volt = { min = 5, nominal = 5, max = 5, source = { estimate = "Оценка, замерить шину. Здесь 5 В из источника Тевенина catalog/electrical/reference.toml, только для проверки проводки." } }

[parts.xyz_supply.series]
ohm = { min = 1, nominal = 1, max = 1, source = { estimate = "Оценка, замерить выходную ВАХ. Здесь 1 Ом из источника Тевенина catalog/electrical/reference.toml." } }

[parts.xyz_fuse.closed]
ohm = { min = 0.1, nominal = 0.1, max = 0.1, source = { estimate = "Оценка, замерить реальный участок. Здесь 0,1 Ом из catalog/electrical/diagnostics/nominal.toml, fuse_series.closed." } }

[parts.xyz_cable.core]
ohm = { min = 0.2, nominal = 0.2, max = 0.2, source = { estimate = "Оценка, замерить жилу. Здесь 0,2 Ом из эталона reference_jumper в catalog/electrical/reference.toml." } }

[parts.xyz_axis_channel.load]
ohm = { min = 100, nominal = 100, max = 100, source = { estimate = "Оценка, замерить ВАХ нагрузки. Здесь 100 Ом из reference_load в catalog/electrical/reference.toml, условная нагрузка для сверки монтажа." } }

[parts.xyz_controller.idle]
ohm = { min = 1000, nominal = 1000, max = 1000, source = { estimate = "Оценка, замерить вход и ток покоя. Здесь 1 кОм из reference_receiver в catalog/electrical/reference.toml." } }

[parts.xyz_controller.command]
volt = { min = 0, nominal = 0, max = 0, source = { estimate = "Граница начального опыта: команды запрещены, сигнал концевика удерживается на возврате. Это состояние теста, реальные уровни замерить." } }

[parts.xyz_controller.input_x]
ohm = { min = 1000, nominal = 1000, max = 1000, source = { estimate = "Оценка, замерить вход и ток покоя. Здесь 1 кОм из reference_receiver в catalog/electrical/reference.toml." } }

[parts.xyz_controller.input_y]
ohm = { min = 1000, nominal = 1000, max = 1000, source = { estimate = "Оценка, замерить вход и ток покоя. Здесь 1 кОм из reference_receiver в catalog/electrical/reference.toml." } }

[parts.xyz_controller.input_z]
ohm = { min = 1000, nominal = 1000, max = 1000, source = { estimate = "Оценка, замерить вход и ток покоя. Здесь 1 кОм из reference_receiver в catalog/electrical/reference.toml." } }

[parts.xyz_endstop.idle]
ohm = { min = 1000, nominal = 1000, max = 1000, source = { estimate = "Оценка, замерить вход и ток покоя. Здесь 1 кОм из reference_receiver в catalog/electrical/reference.toml." } }

[parts.xyz_endstop.state]
volt = { min = 0, nominal = 0, max = 0, source = { estimate = "Граница начального опыта: команды запрещены, сигнал концевика удерживается на возврате. Это состояние теста, реальные уровни замерить." } }

[parts.xyz_power_gate.key]
on_ohm = { min = 0.1, nominal = 0.1, max = 0.1, source = { estimate = "Оценка, замерить ВАХ ключа, порог и гистерезис. Числа из high_side_key_pwm.key в catalog/electrical/diagnostics/nominal.toml." } }
off_ohm = { min = 1000000000, nominal = 1000000000, max = 1000000000, source = { estimate = "Оценка, замерить ВАХ ключа, порог и гистерезис. Числа из high_side_key_pwm.key в catalog/electrical/diagnostics/nominal.toml." } }
threshold_v = { min = 1, nominal = 1, max = 1, source = { estimate = "Оценка, замерить ВАХ ключа, порог и гистерезис. Числа из high_side_key_pwm.key в catalog/electrical/diagnostics/nominal.toml." } }
hysteresis_v = { min = 0, nominal = 0, max = 0, source = { estimate = "Оценка, замерить ВАХ ключа, порог и гистерезис. Числа из high_side_key_pwm.key в catalog/electrical/diagnostics/nominal.toml." } }

[parts.xyz_portal_connector.plus]
ohm = { min = 0.1, nominal = 0.1, max = 0.1, source = { estimate = "Оценка, замерить реальный участок. Здесь 0,1 Ом из catalog/electrical/diagnostics/nominal.toml, fuse_series.closed." } }

[parts.xyz_portal_connector.return]
ohm = { min = 0.1, nominal = 0.1, max = 0.1, source = { estimate = "Оценка, замерить реальный участок. Здесь 0,1 Ом из catalog/electrical/diagnostics/nominal.toml, fuse_series.closed." } }

[parts.xyz_tool_connector.plus]
ohm = { min = 0.1, nominal = 0.1, max = 0.1, source = { estimate = "Оценка, замерить реальный участок. Здесь 0,1 Ом из catalog/electrical/diagnostics/nominal.toml, fuse_series.closed." } }

[parts.xyz_tool_connector.return]
ohm = { min = 0.1, nominal = 0.1, max = 0.1, source = { estimate = "Оценка, замерить реальный участок. Здесь 0,1 Ом из catalog/electrical/diagnostics/nominal.toml, fuse_series.closed." } }

[parts.xyz_outlet_monitor.bleed]
ohm = { min = 1000000, nominal = 1000000, max = 1000000, source = { estimate = "Оценка, замерить разрядную цепь. Здесь 1 МОм из mg90s_servo.load_bleed в catalog/electrical/diagnostics/nominal.toml." } }

[parts.xyz_mating_boundary.emf]
volt = { min = 0, nominal = 0, max = 0, source = { estimate = "Граница начального опыта: команды запрещены, сигнал концевика удерживается на возврате. Это состояние теста, реальные уровни замерить." } }

[parts.xyz_mating_boundary.series]
ohm = { min = 1, nominal = 1, max = 1, source = { estimate = "Оценка, замерить выходную ВАХ. Здесь 1 Ом из источника Тевенина catalog/electrical/reference.toml." } }

[parts.xyz_heater_control.idle]
ohm = { min = 1000, nominal = 1000, max = 1000, source = { estimate = "Оценка, замерить вход и ток покоя. Здесь 1 кОм из reference_receiver в catalog/electrical/reference.toml." } }

[parts.xyz_heater_control.command]
volt = { min = 0, nominal = 0, max = 0, source = { estimate = "Граница начального опыта: команды запрещены, сигнал концевика удерживается на возврате. Это состояние теста, реальные уровни замерить." } }

[parts.xyz_thermal_cutout.closed]
