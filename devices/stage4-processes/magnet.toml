world = "world-offset.toml"
window_ns = [1000000, 4000000]
source = "Короткий опыт на базовом шаге 1 мс и двух последовательных делениях пополам."

[models."стык"]
kind = "attachment"
mounts = ["стенд/опора/стык", "стенд/блок/стык"]
available_travel_m = { value = 0.04, source = { datasheet = "Расчётное условие только синтетического опыта." } }
requests = [{ at_ns = 2000000, action = "attach" }]
loading = { source = "Начало и величина задающей внешней осевой силы численного стенда.", steps = [{ at_ns = 0, force_n = [8, 0, 0], torque_nm = [0, 0, 0] }] }

[models."стык".limits]
gap_m = { value = 0.03, source = { datasheet = "Расчётное условие только синтетического опыта." } }
lateral_m = { value = 0.001, source = { datasheet = "Расчётное условие только синтетического опыта." } }
axis_error_rad = { value = 0.01, source = { datasheet = "Расчётное условие только синтетического опыта." } }
speed_m_s = { value = 0.1, source = { datasheet = "Расчётное условие только синтетического опыта." } }
angular_speed_rad_s = { value = 0.1, source = { datasheet = "Расчётное условие только синтетического опыта." } }
required_travel_m = { value = 0.001, source = { datasheet = "Расчётное условие только синтетического опыта." } }
release_force_n = { value = 0.01, source = { datasheet = "Расчётное условие только синтетического опыта." } }
release_torque_nm = { value = 0.01, source = { datasheet = "Расчётное условие только синтетического опыта." } }
capacity = { force_n = { value = 100, source = { datasheet = "Расчётное условие только синтетического опыта." } }, torque_nm = { value = 1, source = { datasheet = "Расчётное условие только синтетического опыта." } } }

[models."стык".law]
type = "magnetic"
pull = [{ displacement_m = { value = 0, source = { datasheet = "Расчётное условие только синтетического опыта." } }, force_n = { value = 20, source = { datasheet = "Расчётное условие только синтетического опыта." } } }, { displacement_m = { value = 0.04, source = { datasheet = "Расчётное условие только синтетического опыта." } }, force_n = { value = 0, source = { datasheet = "Расчётное условие только синтетического опыта." } } }]

[states]
"стык" = ["Free", "Attached"]

[[events]]
name = "стык"
state = "Attached"
applied_ns = [2000000, 2000000]
requested_ns = 2000000
phase_tolerance_ns = { value = 1000000, source = { datasheet = "Один базовый такт опыта." } }
[[criteria]]
name = "осевая сила поля"
series = { measurement = "стык/applied_force" }
unit = "N"
statistic = "maximum"
lower = { value = 9.97, source = { datasheet = "Независимый расчёт для стенда: 10 N, допуск 0.03 N." } }
upper = { value = 10.03, source = { datasheet = "Независимый расчёт для стенда: 10 N, допуск 0.03 N." } }
tolerance = { value = 0.03, source = { datasheet = "Независимый расчёт для стенда: 10 N, допуск 0.03 N." } }
remainder = [{ value = 0.0075, source = { datasheet = "Независимый расчёт для стенда: 10 N, допуск 0.03 N." } }, { value = 0, source = { datasheet = "Один решатель, численная сверка по аналитике." } }, { value = 0, source = { datasheet = "Фиксированные параметры численного опыта." } }]
