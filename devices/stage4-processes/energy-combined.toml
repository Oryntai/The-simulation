# Сумма двух накопителей 0,104 Дж. Каждый по отдельности ниже 0,1 Дж.
[inventory]
"блок" = ["stored_energy"]

[model_mounts]
"накопитель" = "блок"
"дополнительный" = "блок"

[models."дополнительный"]
kind = "stored_energy"
limit_j = { value = 0.1, source = { datasheet = "Условный предел 0,1 Дж спецификации теста. Порога для человека здесь нет." } }

[models."дополнительный".store]
type = "capacitor"
capacitance_f = { value = 0.002, source = { datasheet = "Расчётное условие только синтетического опыта." } }
voltage_v = { value = 8, source = { datasheet = "Расчётное условие только синтетического опыта." } }

