world = "world-energy.toml"
window_ns = [0, 4000000]
source = "Короткий опыт на базовом шаге 1 мс и двух последовательных делениях пополам."

[models."накопитель".store]
type = "spring"

[models."накопитель"]
kind = "stored_energy"
limit_j = { value = 0.1, source = { datasheet = "Расчётное условие только синтетического опыта." } }

[[criteria]]
name = "запас энергии"
series = { measurement = "накопитель/energy" }
unit = "J"
statistic = "end"
lower = { value = 0.0399999999, source = { datasheet = "Независимый расчёт для стенда: 0.04 J, допуск 1e-10 J." } }
upper = { value = 0.0400000001, source = { datasheet = "Независимый расчёт для стенда: 0.04 J, допуск 1e-10 J." } }
tolerance = { value = 1e-10, source = { datasheet = "Независимый расчёт для стенда: 0.04 J, допуск 1e-10 J." } }
remainder = [{ value = 2.5e-11, source = { datasheet = "Независимый расчёт для стенда: 0.04 J, допуск 1e-10 J." } }, { value = 0, source = { datasheet = "Один решатель, численная сверка по аналитике." } }, { value = 0, source = { datasheet = "Фиксированные параметры численного опыта." } }]
