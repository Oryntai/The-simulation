# Корпус на свободном основании, начало кадра на оси колёс. Размеры — оценка компоновки.
format = 3
name = "Балансирующая тележка"

[[links]]
name = "корпус"

[links.joint]
kind = "free"

[links.mass]
kind = "explicit"
mass_kg = 0.8
com_m = [0.0, 0.0, 0.09]
# Брусок 0.10 × 0.06 × 0.18 м: I = m(a² + b²)/12.
