# Контрольное устройство 7 из docs/PLATFORM_SPEC.md: свободное основание на двух колёсах.
format = 3
name = "Контрольное устройство 7"
seed = 7
physics_hz = 1000
gravity_m_s2 = [0.0, 0.0, -9.80665]

[environment]
density_kg_m3 = 0.0
viscosity_pa_s = 0.0
wind_m_s = [0.0, 0.0, 0.0]

[[environment.collision]]
shape = { kind = "box", size_m = [6.0, 6.0, 0.1] }
pose = { position_m = [0.0, 0.0, -0.05] }
friction = [0.8, 0.005, 0.0001]

[[devices]]
name = "тележка"
file = "device.toml"
# Ось колёс над полом на радиус колеса, корпус отклонён на 3° от вертикали.
pose = { position_m = [0.0, 0.0, 0.0405], rpy_deg = [0.0, 3.0, 0.0] }
