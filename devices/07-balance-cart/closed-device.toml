[[sensors]]
name = "иму"
part = "bmi270"
link = "корпус"

[sensors.params]
# Идеализированный режим считывания BMI270. Такт 4 мс совпадает с
# целым числом шагов физики. Модель акселерометра вычисляет a−g.
rate_hz = 250.0
latency_s = 0.0
bias = 0.0
noise_std = 0.0
drift_per_s = 0.0
drift_rw_std = 0.0
drop_probability = 0.0
quantum = 0.0
fault = 0.0
saturation = 0.0
gyro_bias = 0.0
gyro_noise_std = 0.0
gyro_drift_per_s = 0.0
gyro_drift_rw_std = 0.0
gyro_quantum = 0.0
gyro_saturation = 0.0
mount_dx_m = 0.0
mount_dy_m = 0.0
mount_dz_m = 0.0
mount_roll_rad = 0.0
mount_pitch_rad = 0.0
mount_yaw_rad = 0.0
