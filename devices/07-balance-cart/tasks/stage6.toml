limits = [{ kind = "range", signal = { name = "наклон основания", unit = "rad" }, min = -1.7, max = 1.7, source = { kind = "estimate", reference = "15° стендового удержания или 97° наблюдения падения. Рабочий предел конструкции не измерен." } }]
response = { signal = { name = "наклон основания", unit = "rad" }, min_change = 0.005, within_ns = 150000000, source = { kind = "derived", reference = "0.005 рад меньше начального наклона 3° из world.toml." } }
