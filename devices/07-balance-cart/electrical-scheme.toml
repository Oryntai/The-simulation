format = 1
scope = "assembly"
name = "Два мостовых канала на общей защищаемой шине"
nets = ["cut_l", "cut_r", "dir_l", "dir_r", "enable_l", "enable_r", "enca_l", "enca_r", "encb_l", "encb_r", "logic", "ma_l", "ma_r", "mb_l", "mb_r", "protected", "pwm_l", "pwm_r", "raw", "return", "scl", "sda", "switched_l", "switched_r"]

# Плюсы расходятся из feed_bus, возвраты сходятся в return_bus. У каждого моста своя жила возврата.
# Соединения описывают проектные клеммы, а не подтверждённую распиновку выбранного железа.

[components]
source = { part = "cart_bus_supply", nets = { p = "raw", g = "return" } }
fuse = { part = "cart_series_fuse", nets = { p = "raw", q = "protected" } }
feed_bus = { part = "cart_bus_terminal", nets = { t = "protected" } }
return_bus = { part = "cart_return_terminal", nets = { t = "return" } }
logic_bus = { part = "cart_bus_terminal", nets = { t = "logic" } }
logic = { part = "cart_logic_supply", nets = { p = "protected", q = "logic", g = "return" } }
controller = { part = "cart_control_unit", nets = { p = "logic", g = "return", pwm_l = "pwm_l", dir_l = "dir_l", enable_l = "enable_l", pwm_r = "pwm_r", dir_r = "dir_r", enable_r = "enable_r", cut_l = "cut_l", cut_r = "cut_r", enca_l = "enca_l", encb_l = "encb_l", enca_r = "enca_r", encb_r = "encb_r", scl = "scl", sda = "sda" } }
imu = { part = "cart_imu_bmi270", nets = { vdd = "logic", vddio = "logic", g = "return", scl = "scl", sda = "sda" } }
cut_l = { part = "cart_high_side_cut", nets = { p = "protected", q = "switched_l", g = "return", gate = "cut_l" } }
bridge_l = { part = "cart_dc_bridge", nets = { p = "switched_l", g = "return", a = "ma_l", b = "mb_l", pwm = "pwm_l", dir = "dir_l", enable = "enable_l" } }
motor_l = { part = "cart_motor_2214", nets = { a = "ma_l", b = "mb_l" } }
encoder_l = { part = "cart_encoder_candidate", nets = { p = "logic", g = "return", a = "enca_l", b = "encb_l" } }
cut_r = { part = "cart_high_side_cut", nets = { p = "protected", q = "switched_r", g = "return", gate = "cut_r" } }
bridge_r = { part = "cart_dc_bridge", nets = { p = "switched_r", g = "return", a = "ma_r", b = "mb_r", pwm = "pwm_r", dir = "dir_r", enable = "enable_r" } }
motor_r = { part = "cart_motor_2214", nets = { a = "ma_r", b = "mb_r" } }
encoder_r = { part = "cart_encoder_candidate", nets = { p = "logic", g = "return", a = "enca_r", b = "encb_r" } }
main_return = { part = "cart_harness_core", nets = { a = "return", b = "return" } }
source_fuse = { part = "cart_harness_core", nets = { a = "raw", b = "raw" } }
main_feed = { part = "cart_harness_core", nets = { a = "protected", b = "protected" } }
logic_return = { part = "cart_harness_core", nets = { a = "return", b = "return" } }
logic_in = { part = "cart_harness_core", nets = { a = "protected", b = "protected" } }
logic_out = { part = "cart_harness_core", nets = { a = "logic", b = "logic" } }
controller_return = { part = "cart_harness_core", nets = { a = "return", b = "return" } }
controller_feed = { part = "cart_harness_core", nets = { a = "logic", b = "logic" } }
imu_return = { part = "cart_harness_core", nets = { a = "return", b = "return" } }
imu_vdd = { part = "cart_harness_core", nets = { a = "logic", b = "logic" } }
imu_vddio = { part = "cart_harness_core", nets = { a = "logic", b = "logic" } }
imu_scl = { part = "cart_harness_core", nets = { a = "scl", b = "scl" } }
imu_sda = { part = "cart_harness_core", nets = { a = "sda", b = "sda" } }
bridge_return_l = { part = "cart_harness_core", nets = { a = "return", b = "return" } }
cut_return_l = { part = "cart_harness_core", nets = { a = "return", b = "return" } }
cut_feed_l = { part = "cart_harness_core", nets = { a = "protected", b = "protected" } }
cut_command_l = { part = "cart_harness_core", nets = { a = "cut_l", b = "cut_l" } }
bridge_feed_l = { part = "cart_harness_core", nets = { a = "switched_l", b = "switched_l" } }
pwm_l = { part = "cart_harness_core", nets = { a = "pwm_l", b = "pwm_l" } }
dir_l = { part = "cart_harness_core", nets = { a = "dir_l", b = "dir_l" } }
enable_l = { part = "cart_harness_core", nets = { a = "enable_l", b = "enable_l" } }
motor_a_l = { part = "cart_harness_core", nets = { a = "ma_l", b = "ma_l" } }
motor_b_l = { part = "cart_harness_core", nets = { a = "mb_l", b = "mb_l" } }
