main = { ends = ["feed_bus/t", "return_bus/t"], reverse_limit_v = { measurement = "Сверить стойкость к обратной полярности по паспорту выбранного модуля и защиты." } }
bridge_l = { ends = ["bridge_l/p", "bridge_l/g"], reverse_limit_v = { measurement = "Сверить стойкость к обратной полярности по паспорту выбранного модуля и защиты." } }
bridge_r = { ends = ["bridge_r/p", "bridge_r/g"], reverse_limit_v = { measurement = "Сверить стойкость к обратной полярности по паспорту выбранного модуля и защиты." } }
controller = { ends = ["controller/p", "controller/g"], reverse_limit_v = { measurement = "Сверить стойкость к обратной полярности по паспорту выбранного модуля и защиты." } }
imu_vdd = { ends = ["imu/vdd", "imu/g"], reverse_limit_v = { measurement = "Сверить стойкость к обратной полярности по паспорту выбранного модуля и защиты." } }
imu_vddio = { ends = ["imu/vddio", "imu/g"], reverse_limit_v = { measurement = "Сверить стойкость к обратной полярности по паспорту выбранного модуля и защиты." } }
encoder_l = { ends = ["encoder_l/p", "encoder_l/g"], reverse_limit_v = { measurement = "Сверить стойкость к обратной полярности по паспорту выбранного модуля и защиты." } }
encoder_r = { ends = ["encoder_r/p", "encoder_r/g"], reverse_limit_v = { measurement = "Сверить стойкость к обратной полярности по паспорту выбранного модуля и защиты." } }

[[bindings]]
target = { kind = "drive_power", drive = "мотор_левое" }
ends = ["bridge_l/p", "bridge_l/g"]

[[bindings]]
target = { kind = "drive_power", drive = "мотор_правое" }
ends = ["bridge_r/p", "bridge_r/g"]

[[bindings]]
target = { kind = "sensor_power", sensor = "иму" }
ends = ["imu/vdd", "imu/g"]

[modes.source_disconnects]
source = "source_fuse_start"
