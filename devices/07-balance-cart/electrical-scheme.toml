encoder_feed_l = { part = "cart_harness_core", nets = { a = "logic", b = "logic" } }
encoder_a_l = { part = "cart_harness_core", nets = { a = "enca_l", b = "enca_l" } }
encoder_b_l = { part = "cart_harness_core", nets = { a = "encb_l", b = "encb_l" } }
bridge_return_r = { part = "cart_harness_core", nets = { a = "return", b = "return" } }
cut_return_r = { part = "cart_harness_core", nets = { a = "return", b = "return" } }
cut_feed_r = { part = "cart_harness_core", nets = { a = "protected", b = "protected" } }
cut_command_r = { part = "cart_harness_core", nets = { a = "cut_r", b = "cut_r" } }
bridge_feed_r = { part = "cart_harness_core", nets = { a = "switched_r", b = "switched_r" } }
pwm_r = { part = "cart_harness_core", nets = { a = "pwm_r", b = "pwm_r" } }
dir_r = { part = "cart_harness_core", nets = { a = "dir_r", b = "dir_r" } }
enable_r = { part = "cart_harness_core", nets = { a = "enable_r", b = "enable_r" } }
motor_a_r = { part = "cart_harness_core", nets = { a = "ma_r", b = "ma_r" } }
motor_b_r = { part = "cart_harness_core", nets = { a = "mb_r", b = "mb_r" } }
encoder_return_r = { part = "cart_harness_core", nets = { a = "return", b = "return" } }
encoder_feed_r = { part = "cart_harness_core", nets = { a = "logic", b = "logic" } }
encoder_a_r = { part = "cart_harness_core", nets = { a = "enca_r", b = "enca_r" } }
encoder_b_r = { part = "cart_harness_core", nets = { a = "encb_r", b = "encb_r" } }

