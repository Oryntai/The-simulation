# Прямые команды штатным портам двух приводов. Регулятор замкнутого контура
# остаётся в control.toml и stage6-control.toml для прежних задач.
# Нормированные 0, +1, −1 означают ноль, прямую и обратную полную скважность.
# В 5 мс включаются оба канала, в 9 мс отключается левый, в 13 мс правый.
# Оба повторно включаются в 19 мс, команда меняет знак в 23 мс.
# Горизонт 27 мс оставляет ещё 4 мс наблюдения по такту controller.toml.
version = 1

[[stimulus]]
at_ns = 0
target = "тележка/момент_левое"
unit = "1"
value = 0
source = "Начальная нулевая команда, резерв stage6-control.toml."

[[stimulus]]
at_ns = 0
target = "тележка/момент_левое-power"
unit = "bool"
value = 0
source = "Начальное снятое разрешение, резерв stage6-control.toml."

[[stimulus]]
at_ns = 0
target = "тележка/момент_правое"
unit = "1"
value = 0
source = "Начальная нулевая команда, резерв stage6-control.toml."

[[stimulus]]
at_ns = 0
target = "тележка/момент_правое-power"
unit = "bool"
value = 0
source = "Начальное снятое разрешение, резерв stage6-control.toml."

[[stimulus]]
at_ns = 5000000
target = "тележка/момент_левое"
unit = "1"
value = 1
source = "Предельная нормированная скважность. Пуск на один такт питания позже замыкания ключей."

[[stimulus]]
at_ns = 5000000
target = "тележка/момент_левое-power"
unit = "bool"
value = 1
source = "Общий момент подачи разрешения на оба канала. Один такт 1 мс после замыкания ключей."

[[stimulus]]
at_ns = 5000000
target = "тележка/момент_правое"
unit = "1"
value = 1
source = "Предельная нормированная скважность. Пуск на один такт питания позже замыкания ключей."

[[stimulus]]
at_ns = 5000000
target = "тележка/момент_правое-power"
unit = "bool"
value = 1
source = "Общий момент подачи разрешения на оба канала. Один такт 1 мс после замыкания ключей."

[[stimulus]]
at_ns = 9000000
target = "тележка/момент_левое-power"
unit = "bool"
value = 0
source = "Снятие разрешения после четырёхмиллисекундного окна левого канала. Правый остаётся включён."

[[stimulus]]
at_ns = 13000000
target = "тележка/момент_правое-power"
unit = "bool"
value = 0
source = "Снятие правого разрешения через ещё один период регулятора 4 мс. Скважность остаётся +1."

[[stimulus]]
at_ns = 19000000
target = "тележка/момент_левое-power"
unit = "bool"
value = 1
source = "Умышленное повторное разрешение через один такт питания после замыкания ключей, скважность остаётся +1."

[[stimulus]]
at_ns = 19000000
target = "тележка/момент_правое-power"
unit = "bool"
value = 1
source = "Умышленное повторное разрешение через один такт питания после замыкания ключей, скважность остаётся +1."

[[stimulus]]
at_ns = 23000000
target = "тележка/момент_левое"
unit = "1"
value = -1
source = "Реверс после полного периода регулятора 4 мс на повторном пуске. Длительность окна наблюдения 4 мс."

[[stimulus]]
at_ns = 23000000
target = "тележка/момент_правое"
unit = "1"
value = -1
source = "Реверс после полного периода регулятора 4 мс на повторном пуске. Длительность окна наблюдения 4 мс."
