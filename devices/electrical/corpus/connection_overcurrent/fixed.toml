format = 1
scope = "reference"
name = "Блок: ток стыка"
nets = ["g", "p"]

[components.supply]
part = "supply_5"
nets = { p = "p", g = "g" }

[components.load]
part = "load_2"
nets = { a = "p", b = "g" }

[connections.feed]
kind = "solder"
ends = ["supply/p", "load/a"]
resistance_ohm = { measurement = "Условие стенда: сопротивление участка 0.05 Ом", range = { min = 0.05, nominal = 0.05, max = 0.05, source = { derived = "Условие стенда: сопротивление участка 0.05 Ом" } } }
current_limit_a = { measurement = "Паспорт синтетического стенда Э2: предел данного участка 2 А", range = { min = 2.0, nominal = 2.0, max = 2.0, source = { datasheet = "Паспорт синтетического стенда Э2: предел данного участка 2 А" } } }

[connections.return]
kind = "solder"
ends = ["load/b", "supply/g"]
resistance_ohm = { measurement = "Условие стенда: сопротивление участка 0.1 Ом", range = { min = 0.1, nominal = 0.1, max = 0.1, source = { derived = "Условие стенда: сопротивление участка 0.1 Ом" } } }
current_limit_a = { measurement = "Паспорт синтетического стенда Э2: предел данного участка 5 А", range = { min = 5.0, nominal = 5.0, max = 5.0, source = { datasheet = "Паспорт синтетического стенда Э2: предел данного участка 5 А" } } }

[[modes.cases]]
mode = { kind = "main_only" }
source = { derived = "Фиксированная постановка синтетического корпуса Э2" }
probes = [{ kind = "voltage", ends = ["load/a", "load/b"] }, { kind = "voltage", ends = ["supply/p", "load/a"] }, { kind = "current", branch = { kind = "connection", id = "feed" } }, { kind = "power", branch = { kind = "connection", id = "feed" } }]
