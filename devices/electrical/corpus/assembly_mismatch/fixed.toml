# Синтетическая схема, параметры заданы для ручной сверки.
format = 1
scope = "reference"
name = "Блок: сопряжение разъёмов"
nets = ["supply", "return"]

[components.supply]
part = "reference_source"
nets = { plus = "supply", minus = "return" }

[components.load]
part = "reference_load"
nets = { input = "supply", return = "return" }

[components.adapter]
part = "reference_jumper"
nets = { a = "supply", b = "supply" }

[connections.return]
kind = "solder"
ends = ["supply/minus", "load/return"]
resistance_ohm = { measurement = "Четырёхпроводный замер сопротивления без питания", range = { min = 0.1, nominal = 0.1, max = 0.1, source = { derived = "Исходные данные синтетического корпуса: 0,1 Ом на стык" } } }
current_limit_a = { measurement = "Измерить ток при указанном напряжении и допустимом нагреве", range = { min = 1.0, nominal = 1.0, max = 1.0, source = { derived = "Условная граница стенда: 1 А на стык; Э1 её не проверяет" } } }

[connections.source_end]
kind = "plug"
ends = ["supply/plus", "adapter/a"]
after = ["return"]
resistance_ohm = { measurement = "Четырёхпроводный замер сопротивления без питания", range = { min = 0.1, nominal = 0.1, max = 0.1, source = { derived = "Исходные данные синтетического корпуса: 0,1 Ом на стык" } } }
current_limit_a = { measurement = "Измерить ток при указанном напряжении и допустимом нагреве", range = { min = 1.0, nominal = 1.0, max = 1.0, source = { derived = "Условная граница стенда: 1 А на стык; Э1 её не проверяет" } } }

[connections.load_end]
kind = "plug"
ends = ["adapter/b", "load/input"]
after = ["source_end"]
resistance_ohm = { measurement = "Четырёхпроводный замер сопротивления без питания", range = { min = 0.1, nominal = 0.1, max = 0.1, source = { derived = "Исходные данные синтетического корпуса: 0,1 Ом на стык" } } }
current_limit_a = { measurement = "Измерить ток при указанном напряжении и допустимом нагреве", range = { min = 1.0, nominal = 1.0, max = 1.0, source = { derived = "Условная граница стенда: 1 А на стык; Э1 её не проверяет" } } }
