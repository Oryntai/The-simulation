version = 1
[coverage]
# Потолки запусков и времени из блока Е.
runs = 1000
seconds = 1800
repeat_worst = true

[[paths]]
station = "electrical"
mode = "full"
path = "electric"
source = { kind = "derived", reference = "Живой электрический профиль из electrical/acceptance.toml" }
grids = [
    { id = "native", hz = 40000, source = { kind = "derived", reference = "physics_hz из closed-world.toml" } },
    { id = "refined", hz = 80000, source = { kind = "derived", reference = "Удвоение physics_hz штатного мира для сравнения численной сетки" } },
]
electrical_profile = "../../../01-elbow-assist/electrical-profile.toml"

[[paths]]
station = "linked"
mode = "hold_relaxed"
path = "драйвер"
source = { kind = "derived", reference = "Путь из tasks/depth-open.toml" }
grids = [{ id = "native", hz = 40000, source = { kind = "derived", reference = "physics_hz из closed-world.toml" } }]
faults = [
    { node = "channel:ответ", kind = "packet_delay" },
    { node = "channel:радио", kind = "packet_delay" },
    { node = "channel:радио", kind = "packet_loss" },
]
