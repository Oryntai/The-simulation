version = 1
[coverage]
# Потолки запусков и времени из блока Е.
runs = 1000
seconds = 1800
repeat_worst = true

[[paths]]
station = "electrical"
mode = "full"
path = "electric"
source = { kind = "derived", reference = "Живой электрический профиль из electrical/acceptance.toml" }
grids = [
    { id = "native", hz = 1000000, source = { kind = "derived", reference = "physics_hz из world.toml" } },
    { id = "refined", hz = 2000000, source = { kind = "derived", reference = "Удвоение physics_hz штатного мира для сравнения численной сетки" } },
]
electrical_profile = "../../../04-wall-switch/electrical-profile.toml"

[[paths]]
station = "linked"
mode = "нажатие"
path = "мост"
source = { kind = "derived", reference = "Путь из tasks/depth-open.toml" }
grids = [{ id = "native", hz = 1000000, source = { kind = "derived", reference = "physics_hz из world.toml" } }]
faults = [
    { node = "board:плата", kind = "controller_halted" },
]
