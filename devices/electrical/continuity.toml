# Адреса снимаются с монтажных схем, времена — с профилей соответствующих опытов.
# Порог 10 мВ из допуска Э2 различает полки в безнагрузочных окнах.
# Пороги постановок диагностические и не определяют допуск физической сборки.
[[checks]]
id = "01"
owner = "устройство"
rail = "vdd"
return_from = "bank/g"
return_joint = "return_board"
feed_from = "regulator/output"
feed_joint = "logic_power_finish"
probe = "VDD"
on_ns = 30000000
on_min_v = 1.65 # Половина численного номинала 3,3 В.

