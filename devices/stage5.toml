# Сравнения по наименьшему шагу. Минимумы выражают разрешение испытаний.
[[comparisons]]
experiment = "powered"
first = "nominal"
second = "uncoupled"
check = "движение"
min_delta = 0.0001
source = "Разрешение сравнения углов 0,1 мрад при том же опорном движении."

[[comparisons]]
experiment = "powered"
first = "nominal"
second = "fit"
check = "опора"
min_delta = 0.5
source = "Смещение на 2 мм × 2500 Н/м даёт масштаб разницы 5 Н."

[[comparisons]]
experiment = "tension"
first = "nominal"
second = "unloaded"
check = "кинематика"
min_delta = 0.0001
source = "Разрешение сравнения углов 0,1 мрад при снятии тяги."

[[comparisons]]
experiment = "passive"
first = "nominal"
second = "radio-delay"
check = "задержка доставки"
min_delta = 10000000
source = "Разность периодов слотов 20 мс − 10 мс в двух постановках."

