# Программа стенда из control.toml: холостой ход, двуполярная ступень ШИМ и стоп.
# Формат раздела управления, версия 1.
version = 1

[[stimulus]]
at_ns = 0
target = "устройство/натяжитель"
unit = "1"
value = 0.0
source = "Начальная нулевая команда из control.toml."

[[stimulus]]
at_ns = 8000000
target = "устройство/натяжитель"
unit = "1"
value = 0.45
source = "Начало прямого ШИМ на 8 мс из control.toml. Просадка шины проверяется при неизменной команде."

[[stimulus]]
at_ns = 56000000
target = "устройство/натяжитель"
unit = "1"
value = -0.45
source = "Реверс на 56 мс из control.toml для наблюдения знакового тока шины."

[[stimulus]]
at_ns = 108000000
target = "устройство/натяжитель"
unit = "1"
value = 0.0
source = "Снятие команды на 108 мс из control.toml."
