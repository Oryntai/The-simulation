[rails.cell]
ends = ["cell/p", "cell/g"]
reverse_limit_v = { measurement = "Проверить обратную полярность по данным выбранной ячейки и защиты." }

[rails.boost_input]
ends = ["boost/input", "boost/g"]
reverse_limit_v = { measurement = "Уточнить стойкость входа к обратному напряжению и реакцию защиты." }

[rails.controller]
ends = ["controller/p", "controller/g"]
reverse_limit_v = { measurement = "Установить допустимое питание и обратный предел физического контроллера." }

[rails.bridge]
ends = ["bridge/p", "bridge/g"]
reverse_limit_v = { measurement = "Уточнить допустимое обратное напряжение физического моста." }

# Локальное имя сохраняется при замене владельца и канала усилия.
[[bindings]]
target = { kind = "drive_power", drive = "двигатель" }
ends = ["bridge/p", "bridge/g"]

# Для режимов без ячейки размыкается штатный плюсовой стык.
[modes.source_disconnects]
cell = "cell_feed_start"
