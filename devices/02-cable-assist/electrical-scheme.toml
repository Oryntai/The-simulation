format = 1
scope = "assembly"
name = "Эскиз питания и жгута коллекторного двигателя"
nets = ["cell_p", "dir", "enable", "feed", "motor_a", "motor_b", "motor_bus", "protected", "pwm", "return"]

# Имена цепей маркируют монтаж. Соединения заданы по каждой жиле и каждому стыку.
# Общий минус сводится в узел boost/g. Тип распределительной клеммы, число жил
# на контакт и совместимость с гильзами подтвердить по выбранным деталям.
# До включения проверить разводку, полярность шин и стыки по сборочному листу.
# Порог стендового источника назначить после выбора деталей и проверки их
# огибающих тока. Первое включение провести на закреплённой стендовой сборке
# с ограниченным ходом и без контакта с человеком.
# Начать с отсоединённого двигателя и проверить, что разрешение снято.
# На первом включении записать напряжения ячейки, входа и выхода преобразователя,
# питания моста и уровни ШИМ/направления/разрешения относительно локальных опор.

[components.cell]
part = "cell_1s_candidate"
nets = { p = "cell_p", g = "return" }

[components.bms]
part = "cell_protection"
nets = { input = "cell_p", output = "protected", g = "return" }

[components.fuse]
part = "fuse_inline_candidate"
nets = { input = "protected", output = "feed" }

[components.boost]
part = "motor_boost"
nets = { input = "feed", output = "motor_bus", g = "return" }

[components.bridge]
part = "motor_h_bridge"
nets = { p = "motor_bus", g = "return", a = "motor_a", b = "motor_b", pwm = "pwm", dir = "dir", enable = "enable" }

[components.controller]
part = "motor_controller"
nets = { p = "feed", g = "return", pwm = "pwm", dir = "dir", enable = "enable" }

[components.motor]
part = "pololu_2214"
nets = { a = "motor_a", b = "motor_b" }

[components.cell_return]
part = "flexible_harness_wire"
nets = { a = "return", b = "return" }

[components.bms_return]
part = "flexible_harness_wire"
nets = { a = "return", b = "return" }

[components.bridge_return]
part = "flexible_harness_wire"
nets = { a = "return", b = "return" }

[components.controller_return]
part = "flexible_harness_wire"
nets = { a = "return", b = "return" }

[components.cell_feed]
part = "flexible_harness_wire"
nets = { a = "cell_p", b = "cell_p" }

[components.bms_feed]
part = "flexible_harness_wire"
nets = { a = "protected", b = "protected" }

[components.fused_feed]
part = "flexible_harness_wire"
nets = { a = "feed", b = "feed" }

[components.controller_feed]
part = "flexible_harness_wire"
nets = { a = "feed", b = "feed" }

[components.bridge_feed]
part = "flexible_harness_wire"
nets = { a = "motor_bus", b = "motor_bus" }

[components.pwm_lead]
part = "flexible_harness_wire"
nets = { a = "pwm", b = "pwm" }

[components.dir_lead]
part = "flexible_harness_wire"
nets = { a = "dir", b = "dir" }

[components.enable_lead]
part = "flexible_harness_wire"
nets = { a = "enable", b = "enable" }

[components.motor_a_lead]
part = "flexible_harness_wire"
nets = { a = "motor_a", b = "motor_a" }

[components.motor_b_lead]
part = "flexible_harness_wire"
nets = { a = "motor_b", b = "motor_b" }

[connections.cell_return_start]
kind = "splice"
crimp = true
ends = ["cell/g", "cell_return/a"]
resistance_ohm = { measurement = "Измерить переходное сопротивление стыка четырёхпроводно без питания." }
current_limit_a = { measurement = "Определить предел стыка и жилы для ожидаемого тока, длительности и нагрева." }
after = []

[connections.cell_return_finish]
kind = "terminal"
ends = ["cell_return/b", "boost/g"]
resistance_ohm = { measurement = "Измерить переходное сопротивление стыка четырёхпроводно без питания." }
current_limit_a = { measurement = "Определить предел стыка и жилы для ожидаемого тока, длительности и нагрева." }
after = ["cell_return_start"]

