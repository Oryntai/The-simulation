# Параметры численного опыта Euler/Newton: эталонный профиль MuJoCo 4.0.1.
[contacts.solver]
method = "newton"
elliptic = true
impratio = 1.0
tolerance = 1e-8
iterations = 100
line_search_tolerance = 0.01
line_search_iterations = 50
noslip_tolerance = 1e-6
noslip_iterations = 0
ccd_tolerance = 1e-6
ccd_iterations = 35

[processes."тепло"]
kind = "heat"
nominal_only = true
pair = ["устройство/рама/collision/0", "участник/g0123"]
capacities_j_k = [{ value = 0.12, source = { estimate = "0,133 г алюминиевого узла × 900 Дж/(кг·К), эскиз." } }, { value = 0.08, source = { estimate = "0,023 г ткани × 3500 Дж/(кг·К), эскиз." } }]
initial_k = [{ value = 306.15, source = { estimate = "Испытательное начальное состояние 33 °C." } }, { value = 306.15, source = { estimate = "То же начальное состояние локальной модели." } }]
coefficient_w_m2_k = { value = 1000.0, source = { estimate = "Эскиз 0,12 Вт/К при 120 мм², требует калибровки." } }
area_m2 = { value = 0.00012, source = { estimate = "Эскиз площади 10×12 мм." } }
power_w = [{ at_ns = 0, value = 0.1 }]
source = "Две теплоёмкости, площадь и коэффициент требуют стендовых измерений; только модельный тепловой бюджет."

[probes."гироскопическая невязка"]
kind = "gyro_residual"
port = "устройство/рама/инерциальная-метка"
sensor = "устройство/импульсы/gz"
axis = 2
max_age_ns = 500000

[probes."баланс веса"]
kind = "support"
port = "устройство/рама/инерциальная-метка"
geometries = ["устройство/рама/collision/0", "устройство/рама/collision/1", "устройство/рама/collision/2"]
