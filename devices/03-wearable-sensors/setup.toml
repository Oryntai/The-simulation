[probes."баланс момента"]
kind = "support"
port = "устройство/рама/инерциальная-метка"
geometries = ["устройство/рама/collision/0", "устройство/рама/collision/1", "устройство/рама/collision/2"]
quantity = "static_moment"

[control]
wiring = "control.toml"

[camera]
sensor = "устройство/кадр"
marker_geometry = "environment/visual/0"
color_component = 0
# 25 Гц из каталога, доставка через 8 мс, мгновенная экспозиция.
frames_ns = [[0,8000000],[40000000,48000000],[80000000,88000000],[120000000,128000000],[160000000,168000000],[200000000,208000000]]
min_weight = 60.0

[power]
